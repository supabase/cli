supabase-init:
  - id: basic-usage
    name: Basic usage
    code: supabase init
    output: recorded
    scenario: local-empty-dir
    response: |
      Finished supabase init.
  - id: from-workdir
    name: Initialize from an existing directory
    code: supabase init --workdir .
    output: recorded
    scenario: local-empty-dir
    response: |
      Finished supabase init.
  - id: with-orioledb
    name: Initialize with OrioleDB
    code: supabase init --use-orioledb
    output: recorded
    scenario: local-empty-dir
    response: |
      Finished supabase init.
supabase-login:
  - id: basic-usage
    name: Basic usage
    code: supabase login
    response: |
      You can generate an access token from https://supabase.com/dashboard/account/tokens
      Enter your access token: sbp_****************************************
      Finished supabase login.
