supabase-migration-list:
  - id: basic-usage
    name: Basic usage
    code: supabase migration list --remote
    response: |2
            LOCAL      │     REMOTE     │     TIME (UTC)
      ─────────────────┼────────────────┼──────────────────────
                       │ 20230103054303 │ 2023-01-03 05:43:03
                       │ 20230103093141 │ 2023-01-03 09:31:41
        20230222032233 │                │ 2023-02-22 03:22:33
  - id: with-db-url
    name: Connect to self-hosted database
    code: supabase migration list --remote='postgres://user:pass@db.example.com:5432/postgres'
    output: recorded
    scenario: docker-self-hosted
    response: |+
      Target: custom Postgres (db.example.com:5432)


