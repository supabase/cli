supabase-stop:
  - id: basic-usage
    name: Basic usage
    code: supabase stop
    output: recorded
    scenario: docker-stack-stopping
    response: |
      Stopping containers...
      Stopped supabase local development setup.
      Local data are backed up to docker volume. Use docker to show them: docker volume ls --filter label=com.supabase.cli.project=my-project
  - id: clean-up
    name: Clean up local data after stopping
    code: supabase stop --no-backup
    output: recorded
    scenario: docker-stack-stopping
    response: |
      Stopping containers...
      Stopped supabase local development setup.
