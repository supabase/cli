supabase-migration-new:
  - id: basic-usage
    name: Basic usage
    code: supabase migration new schema_test
    output: recorded
    scenario: local-project
    response: |
      Created new migration at supabase/migrations/20261104183907_schema_test.sql
  - id: pipe-stdin
    name: With statements piped from stdin
    code: echo "create schema if not exists test;" | supabase migration new schema_test
    output: recorded
    scenario: local-project-stdin
    response: |
      Created new migration at supabase/migrations/20261104183908_schema_test.sql
supabase-migration-repair:
  - id: basic-usage
    name: Mark a migration as reverted
    code: supabase migration repair 20230103054303 --status reverted --yes --remote
    response: |
      Target: project My Project (abcdefghijklmnopqrst) · production
      Confirmed by --yes: Mark 1 migration as reverted on project My Project (abcdefghijklmnopqrst) · production
      Repaired migration history: [20230103054303] => reverted
  - id: mark-applied
    name: Mark a migration as applied
    code: supabase migration repair 20230222032233 --status applied --yes --remote
    response: |
      Target: project My Project (abcdefghijklmnopqrst) · production
      Confirmed by --yes: Mark 1 migration as applied on project My Project (abcdefghijklmnopqrst) · production
      Repaired migration history: [20230222032233] => applied
supabase-db-diff:
  - id: basic-usage
    name: Basic usage
    code: supabase db diff -f my_table
    output: recorded
    scenario: docker-schema-drift
    response: |
      Target: local stack (127.0.0.1:54322)
      Creating shadow database...
      Initialising schema...
      Seeding globals from roles.sql...
      Applying migration 20240101000000_create_employees.sql...
      Diffing schemas...
      Finished supabase db diff.

      WARNING: The diff tool is not foolproof, so you may need to manually rearrange and modify the generated migration.
      Run supabase db reset to verify that the new migration does not generate errors.
  - id: linked-project
    name: Against linked project
    code: supabase db diff -f my_table --remote
    response: |
      Target: project My Project (abcdefghijklmnopqrst) · production
      Creating shadow database...
      Diffing schemas: auth,extensions,public,storage
      Finished supabase db diff on branch main.

      WARNING: The diff tool is not foolproof, so you may need to manually rearrange and modify the generated migration.
      Run supabase db reset to verify that the new migration does not generate errors.
  - id: specific-schema
    name: For a specific schema
    code: supabase db diff -f my_table --schema auth
    output: recorded
    scenario: docker-schema-drift
    response: |
      Target: local stack (127.0.0.1:54322)
      Creating shadow database...
      Initialising schema...
      Seeding globals from roles.sql...
      Applying migration 20240101000000_create_employees.sql...
      Diffing schemas: auth
      Finished supabase db diff.

      No schema changes found
supabase-db-dump:
