packages:
  - "."
  - "packages/*"
  - "apps/*"
  - "tools/*"

allowBuilds:
  "@parcel/watcher": true
  "@launchql/protobufjs": true
  esbuild: true
  msgpackr-extract: true
  sharp: true

catalog:
  "@effect/atom-react": "4.0.0-rc.111"
  "@effect/platform-bun": "4.0.0-rc.111"
  "@effect/platform-node": "4.0.0-rc.111"
  "@effect/sql-pg": "4.0.0-rc.111"
  "@effect/tsgo": "0.36.5"
  "@effect/vitest": "4.0.0-rc.111"
  "@tsconfig/bun": "^1.0.11"
  "@types/bun": "^1.4.0"
  "typescript": "^7.0.2"
  "@vitest/coverage-istanbul": "^4.1.10"
  "effect": "4.0.0-rc.111"
  "knip": "^6.32.2"
  "oxfmt": "^0.63.0"
  "oxlint": "1.78.0"
  "oxlint-tsgolint": "^7.0.2001"
  "semantic-release": "^25.0.9"
  "tldts": "^7.4.10"
  "turbo": "2.10.11"
  "vitest": "^4.1.10"

blockExoticSubdeps: true

overrides:
  # pg-topo's parser chain otherwise resolves bleeding-edge Node globals that conflict with Bun's web types.
  "@launchql/protobufjs>@types/node": "24.10.4"

packageExtensions:
  # The global virtual store (virtualStoreType: global) has no hidden hoist
  # directory (node_modules/.pnpm/node_modules), so type packages these
  # dependencies reach for without declaring them are no longer resolvable
  # by tsc's node_modules walk-up. Declare them explicitly here.
  bun-types:
    dependencies:
      # bun-types' fetch overrides do `import("undici-types")` but only
      # declare @types/node; keep this range in sync with @types/node's own
      # undici-types dependency so both resolve to the same copy.
      undici-types: "~8.3.0"
  "@supabase/pg-delta":
    dependencies:
      # pg-delta is consumed as raw TypeScript source (via the `bun` exports
      # condition), which imports `pg` and `debug` without shipping their
      # @types packages.
      "@types/debug": "^4.1.12"
      "@types/pg": "^8.23.1"
  # The root `prepare` script (`effect-tsgo patch --oxlint`) replaces files
  # INSIDE these installed packages: oxlint's dist/index.d.ts, the current
  # platform's @oxlint/binding-* native module, and the @oxlint-tsgolint/*
  # binary. Under `virtualStoreType: global`, each package's store directory
  # is keyed only by the hash of its own dependency graph and shared with
  # every checkout on the machine that resolves the same graph — so those
  # in-place patches would leak into unrelated projects using the same
  # oxlint version. Declaring @effect/tsgo (the patcher) as a dependency of
  # every package it mutates folds the patcher's version into that hash,
  # giving these packages store directories private to identically-patched
  # checkouts and re-keyed whenever @effect/tsgo is bumped.
  # (`catalog:` is not resolvable inside packageExtensions, so this version
  # must be kept in sync with the `@effect/tsgo` catalog entry above.)
  oxlint: &effect-tsgo-patched
    dependencies:
      "@effect/tsgo": "0.36.5"
  "@oxlint/binding-darwin-arm64": *effect-tsgo-patched
  "@oxlint/binding-darwin-x64": *effect-tsgo-patched
  "@oxlint/binding-linux-arm64-gnu": *effect-tsgo-patched
  "@oxlint/binding-linux-arm64-musl": *effect-tsgo-patched
  "@oxlint/binding-linux-x64-gnu": *effect-tsgo-patched
  "@oxlint/binding-linux-x64-musl": *effect-tsgo-patched
  "@oxlint/binding-win32-arm64-msvc": *effect-tsgo-patched
  "@oxlint/binding-win32-x64-msvc": *effect-tsgo-patched
  "@oxlint-tsgolint/darwin-arm64": *effect-tsgo-patched
  "@oxlint-tsgolint/darwin-x64": *effect-tsgo-patched
  "@oxlint-tsgolint/linux-arm64": *effect-tsgo-patched
  "@oxlint-tsgolint/linux-x64": *effect-tsgo-patched
  "@oxlint-tsgolint/win32-arm64": *effect-tsgo-patched
  "@oxlint-tsgolint/win32-x64": *effect-tsgo-patched

minimumReleaseAge: 10200
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.11"
  - "@turbo/darwin-arm64@2.10.11"
  - "@turbo/linux-64@2.10.11"
  - "@turbo/linux-arm64@2.10.11"
  - "@turbo/windows-64@2.10.11"
  - "@turbo/windows-arm64@2.10.11"
  - "@effect/atom-react@4.0.0-rc.111"
  - "@effect/platform-bun@4.0.0-rc.111"
  - "@effect/platform-node@4.0.0-rc.111"
  - "@effect/platform-node-shared@4.0.0-rc.111"
  - "@effect/sql-pg@4.0.0-rc.111"
  - "@effect/vitest@4.0.0-rc.111"
  - "@supabase/pg-delta@1.0.0-alpha.46"
  - "@supabase/pg-topo@1.0.0-alpha.5"
  - "@types/bun@1.4.0"
  - "bun-types@1.4.0"
  - "effect@4.0.0-rc.111"
  - "turbo@2.10.11"

supportedArchitectures:
  cpu:
    - current
    - arm64
    - x64
  libc:
    - current
    - glibc
    - musl
  os:
    - current
    - darwin
    - linux
    - win32

patchedDependencies:
  "@libpg-query/parser@17.6.10": patches/@libpg-query__parser@17.6.10.patch

virtualStoreType: global
