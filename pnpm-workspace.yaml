packages:
  - "packages/*"
  - "apps/*"
  - "tools/*"

allowBuilds:
  '@parcel/watcher': true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  nx: true
  sharp: true

catalog:
  "@effect/atom-react": "4.0.0-beta.97"
  "@effect/platform-bun": "4.0.0-beta.97"
  "@effect/platform-node": "4.0.0-beta.97"
  "@effect/sql-pg": "4.0.0-beta.97"
  "@effect/vitest": "4.0.0-beta.97"
  "@nx/devkit": "^23.0.2"
  "@swc-node/register": "^1.12.1"
  "@swc/core": "^1.15.46"
  "@tsconfig/bun": "^1.0.10"
  "@types/bun": "^1.3.14"
  "@typescript/native-preview": "7.0.0-dev.20260707.2"
  "@vitest/coverage-istanbul": "^4.1.10"
  "effect": "4.0.0-beta.97"
  "knip": "^6.29.0"
  "nx": "^23.0.2"
  "oxfmt": "^0.60.0"
  "oxlint": "^1.75.0"
  "oxlint-tsgolint": "^7.0.2001"
  "tldts": "^7.4.9"
  "vitest": "^4.1.10"

blockExoticSubdeps: true

overrides:
  "@effect/platform-node-shared": "4.0.0-beta.97"

minimumReleaseAge: 10200

supportedArchitectures:
  cpu:
    - current
    - arm64
    - x64
  libc:
    - current
    - glibc
    - musl
  os:
    - current
    - darwin
    - linux
    - win32
