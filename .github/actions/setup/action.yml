name: Setup

description: Perform standard setup and install dependencies using pnpm

inputs:
  dependency-firewall-token:
    description: Token used to authenticate the Dependency Firewall registry
    required: false
    default: ""
  dependency-cache:
    description: >-
      Whether to enable dependency caches. Disable this when the job deletes a
      cached dependency path before exiting, otherwise the post-job cache save
      fails with a path validation error.
    required: false
    default: "true"
  go-cache:
    description: >-
      Whether to restore the Go module and build caches. Disable this in jobs
      that never run Go.
    required: false
    default: "true"
  sticky-disks:
    description: >-
      Whether to mount dependency caches from Blacksmith sticky disks on
      Blacksmith Linux runners. Pull request runs mount them read-only.
    required: false
    default: "false"
  docker-images:
    description: >-
      Whether to keep Docker's image store on a Blacksmith sticky disk so
      stack images are not pulled again on every job. Requires sticky-disks.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # Sticky disks are shared by every run in the repository, so only trusted
    # events (merge queue, pushes) may commit to them; pull request code could
    # otherwise plant dependencies or images that trusted runs later execute.
    # Bump the -v2 key segment to reset a disk that grew stale.
    - name: Detect sticky disks
      id: sticky
      if: inputs.sticky-disks == 'true'
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ -z "${BLACKSMITH_RUNNER_MESSAGE_WAIT_MS:-}" ] || [ "$RUNNER_OS" != Linux ]; then
          exit 0
        fi
        echo "enabled=true" >> "$GITHUB_OUTPUT"
        case "$EVENT_NAME" in
          pull_request*) echo "commit=false" >> "$GITHUB_OUTPUT" ;;
          *) echo "commit=on-change" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Stop Docker before mounting its image disk
      if: inputs.docker-images == 'true' && steps.sticky.outputs.enabled == 'true'
      shell: bash
      run: sudo systemctl stop docker.socket docker.service

    - name: Mount Docker image disk
      if: inputs.docker-images == 'true' && steps.sticky.outputs.enabled == 'true'
      uses: useblacksmith/stickydisk@b6cb58d1d31d6d32a25248fab12493d831f7bd48 # v1.7.2
      with:
        key: ${{ github.repository }}-docker-images-v2-${{ runner.arch }}
        path: /var/lib/docker
        commit: ${{ steps.sticky.outputs.commit }}

    - name: Restart Docker on the image disk
      if: inputs.docker-images == 'true' && steps.sticky.outputs.enabled == 'true'
      shell: bash
      run: |
        sudo systemctl start docker.socket docker.service
        docker info --format '{{.DockerRootDir}} {{.Driver}}'
        docker image ls --format '{{.Repository}}:{{.Tag}}' | wc -l

    - name: Install toolchains
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.9.0

    - name: Resolve pnpm store path
      if: inputs.dependency-cache == 'true'
      id: pnpm-store
      shell: bash
      run: |
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # A sticky disk mounts a block-level snapshot in seconds, while
    # actions/cache downloads and untars the whole store on every job.
    - name: Mount pnpm store disk
      if: inputs.dependency-cache == 'true' && steps.sticky.outputs.enabled == 'true'
      uses: useblacksmith/stickydisk@b6cb58d1d31d6d32a25248fab12493d831f7bd48 # v1.7.2
      with:
        key: ${{ github.repository }}-pnpm-store-v2-${{ runner.arch }}
        path: ${{ steps.pnpm-store.outputs.path }}
        commit: ${{ steps.sticky.outputs.commit }}

    # The disk keeps only files and the index, like the cache below: a links/
    # tree left by an interrupted install would otherwise be trusted as complete.
    - name: Reset pnpm global virtual store
      if: inputs.dependency-cache == 'true' && steps.sticky.outputs.enabled == 'true'
      shell: bash
      run: rm -rf "${{ steps.pnpm-store.outputs.path }}/links"

    # Cache only the content-addressable half of the store (package files plus
    # the SQLite index), never the global virtual store under links/. That
    # directory is a web of directory links between packages: symlinks on
    # POSIX, NTFS junctions on Windows. actions/cache round-trips it through
    # tar, and on Windows the junctions do not come back as traversable
    # directories. pnpm then trusts every restored links/ directory as complete
    # and skips relinking, so the first dependency resolved through a restored
    # junction fails (release smoke-test, Sept 2026). Rebuilding links/ from the
    # cached files is hardlink-only and needs no network, and pnpm itself notes
    # the global virtual store has little value in CI. The key prefix is bumped
    # so restores never match the earlier whole-store archives, which still
    # carry a links/ tree.
    - name: Configure pnpm dependency cache
      if: inputs.dependency-cache == 'true' && steps.sticky.outputs.enabled != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.pnpm-store.outputs.path }}/files
          ${{ steps.pnpm-store.outputs.path }}/index*
        key: pnpm-store-files-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-files-${{ runner.os }}-${{ runner.arch }}-

    - name: Resolve pnpm cache path
      if: inputs.dependency-cache == 'true'
      id: pnpm-cache
      shell: bash
      run: echo "path=$(pnpm cache path --silent)" >> "$GITHUB_OUTPUT"

    # pnpm stores the lockfile's supply-chain verdict in lockfile-verified.jsonl;
    # without it every job re-verifies all entries against registry metadata,
    # which dominates a warm-store install. The verdict is bound to the policy
    # and to the registry it was checked against.
    - name: Configure pnpm verification cache
      if: inputs.dependency-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-cache.outputs.path }}/lockfile-verified.jsonl
        key: pnpm-verify-${{ runner.os }}-${{ inputs.dependency-firewall-token != '' && 'firewall' || 'public' }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

    - name: Resolve Go cache paths
      if: inputs.dependency-cache == 'true' && inputs.go-cache == 'true'
      id: go-cache
      shell: bash
      run: |
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

    - name: Mount Go module disk
      if: inputs.dependency-cache == 'true' && inputs.go-cache == 'true' && steps.sticky.outputs.enabled == 'true'
      uses: useblacksmith/stickydisk@b6cb58d1d31d6d32a25248fab12493d831f7bd48 # v1.7.2
      with:
        key: ${{ github.repository }}-go-mod-v2-${{ runner.arch }}
        path: ${{ steps.go-cache.outputs.mod }}
        commit: ${{ steps.sticky.outputs.commit }}

    - name: Mount Go build disk
      if: inputs.dependency-cache == 'true' && inputs.go-cache == 'true' && steps.sticky.outputs.enabled == 'true'
      uses: useblacksmith/stickydisk@b6cb58d1d31d6d32a25248fab12493d831f7bd48 # v1.7.2
      with:
        key: ${{ github.repository }}-go-build-v2-${{ runner.arch }}
        path: ${{ steps.go-cache.outputs.build }}
        commit: ${{ steps.sticky.outputs.commit }}

    - name: Configure Go dependency cache
      if: inputs.dependency-cache == 'true' && inputs.go-cache == 'true' && steps.sticky.outputs.enabled != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-cache.outputs.mod }}
          ${{ steps.go-cache.outputs.build }}
        key: go-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/cli-go/go.mod', 'apps/cli-go/go.sum') }}
        restore-keys: |
          go-cache-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      env:
        DEPENDENCY_FIREWALL_TOKEN: ${{ inputs.dependency-firewall-token }}
        # Skip husky's hook install: the commit-msg hook is a local dev
        # convenience, not a gate for bot-authored commits (e.g.
        # propose-release-notes.ts), and CI already enforces scopes on the
        # PR title separately.
        HUSKY: "0"
      run: |
        if [ -z "$DEPENDENCY_FIREWALL_TOKEN" ]; then
          echo "Dependency Firewall token unavailable; using default npm registry."
          pnpm install --frozen-lockfile
          exit 0
        fi

        npmrc="${RUNNER_TEMP}/dependency-firewall.npmrc"
        {
          echo "registry=https://firewall.depthfirst.com/npm/"
          echo "//firewall.depthfirst.com/npm/:_authToken=${DEPENDENCY_FIREWALL_TOKEN}"
        } > "$npmrc"
        NPM_CONFIG_USERCONFIG="$npmrc" pnpm install --frozen-lockfile
