name: Setup

description: Perform standard setup and install dependencies using pnpm

inputs:
  dependency-firewall-token:
    description: Token used to authenticate the Dependency Firewall registry
    required: false
    default: ""
  dependency-cache:
    description: >-
      Whether to enable dependency caches. Disable this when the job deletes a
      cached dependency path before exiting, otherwise the post-job cache save
      fails with a path validation error.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install toolchains
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.9.0

    - name: Resolve pnpm store path
      if: inputs.dependency-cache == 'true'
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # Cache only the content-addressable half of the store (package files plus
    # the SQLite index), never the global virtual store under links/. That
    # directory is a web of directory links between packages: symlinks on
    # POSIX, NTFS junctions on Windows. actions/cache round-trips it through
    # tar, and on Windows the junctions do not come back as traversable
    # directories. pnpm then trusts every restored links/ directory as complete
    # and skips relinking, so the first dependency resolved through a restored
    # junction fails (release smoke-test, Sept 2026). Rebuilding links/ from the
    # cached files is hardlink-only and needs no network, and pnpm itself notes
    # the global virtual store has little value in CI. The key prefix is bumped
    # so restores never match the earlier whole-store archives, which still
    # carry a links/ tree.
    - name: Configure pnpm dependency cache
      if: inputs.dependency-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.pnpm-store.outputs.path }}/files
          ${{ steps.pnpm-store.outputs.path }}/index*
        key: pnpm-store-files-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-files-${{ runner.os }}-${{ runner.arch }}-

    - name: Resolve Go cache paths
      if: inputs.dependency-cache == 'true'
      id: go-cache
      shell: bash
      run: |
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

    - name: Configure Go dependency cache
      if: inputs.dependency-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-cache.outputs.mod }}
          ${{ steps.go-cache.outputs.build }}
        key: go-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/cli-go/go.mod', 'apps/cli-go/go.sum') }}
        restore-keys: |
          go-cache-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      env:
        DEPENDENCY_FIREWALL_TOKEN: ${{ inputs.dependency-firewall-token }}
      run: |
        if [ -z "$DEPENDENCY_FIREWALL_TOKEN" ]; then
          echo "Dependency Firewall token unavailable; using default npm registry."
          pnpm install --frozen-lockfile
          exit 0
        fi

        npmrc="${RUNNER_TEMP}/dependency-firewall.npmrc"
        {
          echo "registry=https://firewall.depthfirst.com/npm/"
          echo "//firewall.depthfirst.com/npm/:_authToken=${DEPENDENCY_FIREWALL_TOKEN}"
        } > "$npmrc"
        NPM_CONFIG_USERCONFIG="$npmrc" pnpm install --frozen-lockfile
