name: Save Docker image disk
description: >-
  Removes test leftovers on committing runs and stops Docker, since the image
  disk only commits once nothing holds /var/lib/docker open.

runs:
  using: "composite"
  steps:
    - name: Stop Docker so its image disk can be saved
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [[ "$EVENT_NAME" =~ ^(push|schedule|workflow_dispatch)$ ]]; then
          docker ps --all --quiet | xargs --no-run-if-empty docker rm --force
          docker image ls --quiet --filter label=com.supabase.cli.e2e.broken-image=true |
            xargs --no-run-if-empty docker image rm --force
          docker system prune --force
          docker volume prune --all --force
        fi
        sudo systemctl stop docker.socket docker.service
