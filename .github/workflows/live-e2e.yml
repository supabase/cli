name: Live E2E

on:
  push:
    branches: [develop]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

jobs:
  live-e2e:
    name: Live e2e
    uses: ./.github/workflows/live-e2e-suite.yml
    with:
      ref: ${{ github.sha }}
      concurrency_group: live-e2e-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel_in_progress: ${{ github.event_name == 'push' }}
    secrets: inherit
