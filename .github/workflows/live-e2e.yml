name: Live E2E

on:
  push:
    branches: [develop]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

jobs:
  live-e2e:
    # The reusable suite requires only this explicitly forwarded secret.
    name: Live e2e
    uses: ./.github/workflows/live-e2e-suite.yml
    with:
      ref: ${{ github.sha }}
      # Pushes to develop share a branch group that never cancels a running suite.
      # Manual, scheduled, and stable-gate runs use independent groups because
      # they each own separate temporary projects and may run concurrently.
      concurrency_group: live-e2e-${{ github.event_name == 'push' && github.ref || github.run_id }}
    secrets:
      SUPABASE_E2E_CLI_LIVE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_E2E_CLI_LIVE_STAGING_ACCESS_TOKEN }}

  # Scheduled runs only fire on the default branch, so the other long-lived branches are
  # dispatched; each run keeps its own head_branch for the gate and notifier.
  dispatch-nightly-refs:
    name: Dispatch nightly live e2e for other branches
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Dispatch live e2e runs
        run: |
          set -euo pipefail
          for ref in main next; do
            if gh api "/repos/${REPOSITORY}/branches/${ref}" --silent 2>/dev/null; then
              gh workflow run live-e2e.yml --repo "$REPOSITORY" --ref "$ref"
            else
              echo "Branch ${ref} does not exist; skipping."
            fi
          done
