name: slim-edge-runtime-validation

# TEMPORARY branch-local validation workflow — exercises the released slim
# edge-runtime image (supabase/slim-services chmod-/root + busybox sh/cat
# release) against this branch's slim `functions` Docker flows on a native
# Linux runner, where the CLI user (uid 1001) differs from the container
# user (uid 65532) — the exact condition the original EACCES reports came
# from. Remove this file once the image + CLI pairing is validated.

# `workflow_dispatch` only works for workflows registered on the default
# branch, so this branch-local workflow triggers on pushes touching itself.
on:
  push:
    branches:
      - avallete/supabase-slim-images-flag-c95c16
    paths:
      - .github/workflows/slim-edge-runtime-validation.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate slim edge-runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/supabase/cli/edge-runtime:v1.74.3
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Pull released slim image
        run: |
          set -euxo pipefail
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'User={{.Config.User}} Entrypoint={{.Config.Entrypoint}} Env={{.Config.Env}}'

      - name: Image layout smoke (0755 /root, nonroot home, busybox sh+cat)
        run: |
          set -euxo pipefail
          # Runs as the image's own (non-root) user. The slim image ships only
          # the `sh`/`cat` applet symlinks, so every other coreutil goes
          # through the busybox multi-call binary directly.
          docker run --rm --entrypoint /usr/bin/sh "$IMAGE" -c '
            set -eux
            bb=$(command -v busybox || echo /usr/bin/busybox)
            [ "$($bb id -u)" = "65532" ]
            $bb ls -ld /root /home/nonroot /tmp
            [ "$($bb ls -ld /root | $bb cut -c1-10)" = "drwxr-xr-x" ]
            [ "$($bb stat -c %u /home/nonroot)" = "65532" ]
            command -v cat
          '
          # uid 65532 can read a bind mounted under /root (CI-checkout shape).
          echo probe-ok > "$RUNNER_TEMP/probe-file"
          docker run --rm -v "$RUNNER_TEMP/probe-file:/root/probe/file:ro" \
            --entrypoint /usr/bin/cat "$IMAGE" /root/probe/file | grep -qx probe-ok
          # sh -c heredoc + exec (the CLI's edge-runtime script-runner shape).
          docker run --rm --entrypoint /usr/bin/sh "$IMAGE" -c '
            cat <<'"'"'SENTINEL'"'"' > /tmp/heredoc-probe
          hello
          SENTINEL
            exec cat /tmp/heredoc-probe
          ' | grep -qx hello

      - name: Prepare project, eszip, and mock Management API
        run: |
          set -euxo pipefail
          PROJ="$RUNNER_TEMP/proj"
          mkdir -p "$PROJ"
          cd "$PROJ"
          bun "$GITHUB_WORKSPACE/apps/cli/src/legacy/main.ts" init --force
          mkdir -p supabase/functions/myfn
          cat > supabase/functions/myfn/index.ts <<'EOF'
          Deno.serve(async () => new Response("hello from slim validation"));
          EOF

          # Bundle a genuine eszip with the slim image itself, writing into a
          # 0777 staging dir — the same shape `functions deploy`'s bundler
          # uses (validates the uid-65532 output write).
          FNOUT="$RUNNER_TEMP/fnout"
          mkdir -p "$FNOUT"
          chmod 777 "$FNOUT"
          docker run --rm \
            -v "$PROJ/supabase/functions:/src:ro" \
            -v "$FNOUT:/out" \
            "$IMAGE" bundle --entrypoint /src/myfn/index.ts --output /out/output.eszip
          ls -la "$FNOUT"

          cat > "$RUNNER_TEMP/mock-api.ts" <<'EOF'
          const eszipPath = process.argv[2];
          const port = Number(process.argv[3] ?? "8899");
          const eszip = await Bun.file(eszipPath).arrayBuffer();
          const fn = (slug: string) => ({
            id: "00000000-0000-0000-0000-000000000000",
            slug,
            name: slug,
            status: "ACTIVE",
            version: 1,
            created_at: 1700000000000,
            updated_at: 1700000000000,
            verify_jwt: true,
            entrypoint_path: "file:///src/index.ts",
          });
          Bun.serve({
            port,
            hostname: "127.0.0.1",
            fetch(req) {
              const url = new URL(req.url);
              console.error(`[mock-api] ${req.method} ${url.pathname}`);
              if (/^\/v1\/projects\/[^/]+\/functions\/[^/]+\/body$/.test(url.pathname)) {
                return new Response(eszip, {
                  status: 200,
                  headers: { "Content-Type": "application/octet-stream" },
                });
              }
              if (req.method !== "GET") return Response.json(fn("myfn"));
              const single = url.pathname.match(/^\/v1\/projects\/[^/]+\/functions\/([^/]+)$/);
              if (single) return Response.json(fn(single[1]!));
              if (/^\/v1\/projects\/[^/]+\/functions$/.test(url.pathname)) {
                return Response.json([fn("myfn")]);
              }
              return Response.json({ message: "not found" }, { status: 404 });
            },
          });
          console.error(`[mock-api] listening on http://127.0.0.1:${port}`);
          EOF
          nohup bun "$RUNNER_TEMP/mock-api.ts" "$FNOUT/output.eszip" 8899 > "$RUNNER_TEMP/mock-api.log" 2>&1 &
          for i in $(seq 1 20); do
            curl -sSf -o /dev/null http://127.0.0.1:8899/v1/projects/x/functions && break
            sleep 0.5
          done
          curl -sSf -o /dev/null http://127.0.0.1:8899/v1/projects/x/functions

          cat > "$RUNNER_TEMP/profile.yaml" <<'EOF'
          name: slim-validation
          api_url: "http://127.0.0.1:8899"
          dashboard_url: "http://127.0.0.1:8899"
          project_host: supabase.red
          pooler_host: 127.0.0.1
          EOF

      - name: "Negative control: the pre-fix direct bind write still EACCESes as uid 65532"
        run: |
          set -euxo pipefail
          PROJ="$RUNNER_TEMP/proj"
          ls -ldn "$PROJ/supabase/functions"
          if docker run --rm \
            -v "$RUNNER_TEMP/fnout/output.eszip:/tmp/eszips/output.eszip:ro" \
            -v "$PROJ/supabase/functions:/home/deno:rw" \
            "$IMAGE" unbundle --eszip /tmp/eszips/output.eszip --output /home/deno/oldfail; then
            echo "expected the old direct-bind unbundle write to fail on a runner-owned directory" >&2
            exit 1
          fi
          [ ! -e "$PROJ/supabase/functions/oldfail" ]

      - name: "Scenario 1: slim functions download --use-docker (cp-out staging)"
        env:
          SUPABASE_USE_SLIM_IMAGES: "true"
        run: |
          set -euxo pipefail
          # Dummy token, assembled at runtime so push protection never
          # pattern-matches a literal.
          export SUPABASE_ACCESS_TOKEN="sbp_$(printf 'a%.0s' $(seq 40))"
          export SUPABASE_PROFILE="$RUNNER_TEMP/profile.yaml"
          cd "$RUNNER_TEMP/proj"
          rm -rf supabase/functions/myfn
          bun "$GITHUB_WORKSPACE/apps/cli/src/legacy/main.ts" functions download myfn \
            --project-ref abcdefghijklmnopqrst --use-docker
          test -f supabase/functions/myfn/index.ts
          grep -q "hello from slim validation" supabase/functions/myfn/index.ts
          # Files belong to the invoking user, not the container uid.
          [ "$(stat -c %u supabase/functions/myfn/index.ts)" = "$(id -u)" ]
          # No leftover staging container.
          [ -z "$(docker ps -aq --filter name=supabase_unbundle_)" ]

      - name: "Scenario 2: slim functions deploy --use-docker from a checkout under /root"
        env:
          SUPABASE_USE_SLIM_IMAGES: "true"
        run: |
          set -euxo pipefail
          export SUPABASE_ACCESS_TOKEN="sbp_$(printf 'a%.0s' $(seq 40))"
          sudo cp -r "$RUNNER_TEMP/proj" /root/proj
          # Resolve the real bun binary: a mise shim would re-resolve against
          # root's HOME under sudo and fail.
          BUN_BIN="$(mise which bun 2>/dev/null || command -v bun)"
          sudo env "PATH=$PATH" \
            SUPABASE_ACCESS_TOKEN="$SUPABASE_ACCESS_TOKEN" \
            SUPABASE_PROFILE="$RUNNER_TEMP/profile.yaml" \
            SUPABASE_USE_SLIM_IMAGES=true \
            bash -c "cd /root/proj && '$BUN_BIN' '$GITHUB_WORKSPACE/apps/cli/src/legacy/main.ts' functions deploy myfn --project-ref abcdefghijklmnopqrst --use-docker"

      - name: "Scenario 3: slim Deno-cache volume is seeded and writable by uid 65532"
        run: |
          set -euxo pipefail
          docker volume ls --format '{{.Name}}' | grep -x supabase_edge_runtime_slim_proj
          docker run --rm -v supabase_edge_runtime_slim_proj:/probe \
            --entrypoint /usr/bin/sh "$IMAGE" -c '
              set -eux
              bb=$(command -v busybox || echo /usr/bin/busybox)
              [ "$($bb stat -c %u /probe)" = "65532" ]
              $bb ls -la /probe
              $bb touch /probe/.write-probe
            '

      - name: "Scenario 4: docker.io baseline is unchanged (direct bind write as root)"
        run: |
          set -euxo pipefail
          export SUPABASE_ACCESS_TOKEN="sbp_$(printf 'a%.0s' $(seq 40))"
          export SUPABASE_PROFILE="$RUNNER_TEMP/profile.yaml"
          cd "$RUNNER_TEMP/proj"
          sudo rm -rf supabase/functions/myfn
          bun "$GITHUB_WORKSPACE/apps/cli/src/legacy/main.ts" functions download myfn \
            --project-ref abcdefghijklmnopqrst --use-docker
          sudo test -f supabase/functions/myfn/index.ts
          docker volume ls --format '{{.Name}}' | grep -x supabase_edge_runtime_proj

      - name: Mock API log
        if: always()
        run: cat "$RUNNER_TEMP/mock-api.log" || true
