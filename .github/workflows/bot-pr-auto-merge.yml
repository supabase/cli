name: Bot PR auto-merge

on:
  schedule:
    - cron: "47 * * * *"
  # Set `dry_run` to log decisions without approving or merging.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate and log decisions only; do not approve, merge, or dismiss"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: bot-pr-auto-merge
  cancel-in-progress: false

jobs:
  sweep:
    name: Approve and enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch))
    # Holds `AUTO_APPROVE_PR_PAT`; the environment only deploys from the default branch.
    environment: auto-approve
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: write

      # Only default-branch code runs with the tokens, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
          no-cache: true
      - name: Sweep bot pull requests
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APPROVER_TOKEN: ${{ secrets.AUTO_APPROVE_PR_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bun .github/scripts/bot-pr-auto-merge.ts
