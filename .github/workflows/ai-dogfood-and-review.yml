name: AI Dogfood and Review

# Functional dogfood of the PR CLI (GPT 5.6-luna), then dispatch the existing
# AI review pipeline with the report as runtime evidence. See
# .github/ai-dogfood/README.md for the design and security model.
#
# Two ways to trigger a run:
#   - workflow_dispatch, with a same-repo PR number.
#   - an internal maintainer commenting `/ai-dogfood-and-review` on a PR.
# No pull_request auto trigger (shadow mode). Forks are always refused.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to dogfood and review"
        required: true
        type: string
  issue_comment:
    types:
      - created

permissions: {}

env:
  DOGFOOD_MODEL: gpt-5.6-luna
  SUPABASE_LIVE_API_URL: https://api.supabase.green

# Ordinary issue_comment events fire this workflow for EVERY comment; give
# non-command comments their own per-run group so they cannot cancel an
# in-flight dogfood. Exact equality on the comment body, mirroring resolve.ts.
concurrency:
  group: >-
    ai-dogfood-and-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}-${{
      (github.event_name == 'issue_comment' && github.event.comment.body != '/ai-dogfood-and-review')
        && github.run_id || 'dogfood' }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/ai-dogfood-and-review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      pull-requests: write
      contents: read
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      trigger: ${{ steps.resolve.outputs.trigger }}
      trusted_ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Dispatch uses the selected branch so pre-merge iteration works;
          # comment triggers always run default-branch code.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - name: Resolve
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr || github.event.issue.number || github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          RESOLVE_COMMAND: /ai-dogfood-and-review
          FORBID_FORKS_ON_MANUAL: "true"
        run: bun .github/scripts/ai-review/resolve.ts

  build-cli:
    name: Build PR CLI
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head (untrusted; CLI under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_ref }}
          path: pr
          persist-credentials: false

      - name: Checkout default branch (trusted; toolchain + install script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.trusted_ref }}
          path: trusted
          persist-credentials: false

      - name: Stage trusted toolchain files at workspace root
        run: |
          cp trusted/mise.toml trusted/mise.lock trusted/.bun-version trusted/package.json .

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "trusted/.bun-version"
          no-cache: true

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          version: 2026.7.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(jq -r .packageManager trusted/package.json)" --activate

      - name: Install PR workspace (no staging token)
        run: bash trusted/.github/ai-dogfood/install-pr-cli.sh "$GITHUB_WORKSPACE/pr"

      - name: Restore trusted tree after untrusted install
        run: git -C trusted reset --hard && git -C trusted clean -fdx

      - name: CLI --version
        env:
          DOGFOOD_CLI_MAIN: ${{ github.workspace }}/pr/apps/cli/src/legacy/main.ts
        run: bun --no-config "$DOGFOOD_CLI_MAIN" --version

  dogfood:
    name: Dogfood
    needs:
      - resolve
      - build-cli
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head (untrusted; CLI under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_ref }}
          path: pr
          persist-credentials: false

      - name: Checkout default branch (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.trusted_ref }}
          path: trusted
          persist-credentials: false

      - name: Stage trusted toolchain files at workspace root
        run: |
          cp trusted/mise.toml trusted/mise.lock trusted/.bun-version trusted/package.json .

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "trusted/.bun-version"
          no-cache: true

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          version: 2026.7.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(jq -r .packageManager trusted/package.json)" --activate

      - name: Install PR workspace (no staging token)
        run: bash trusted/.github/ai-dogfood/install-pr-cli.sh "$GITHUB_WORKSPACE/pr"

      - name: Restore trusted tree after untrusted install
        run: git -C trusted reset --hard && git -C trusted clean -fdx

      - name: Docker preflight
        run: docker info

      - name: Read corpus SHA
        id: corpus
        run: echo "sha=$(tr -d '[:space:]' < trusted/.github/ai-dogfood/corpus.sha)" >> "$GITHUB_OUTPUT"

      - name: Checkout corpus (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: supabase/supabase-config-real-world-samples
          ref: ${{ steps.corpus.outputs.sha }}
          path: corpus
          persist-credentials: false

      - name: Stage samples, scratch, and sb wrapper
        run: |
          set -euo pipefail
          mkdir -p samples scratch/bin /tmp/ai-review /tmp/ai-dogfood
          for sample in usebasejump__basejump vercel__nextjs-subscription-payments; do
            if [ ! -d "corpus/$sample" ]; then
              echo "::error::missing corpus sample $sample at pin ${{ steps.corpus.outputs.sha }}"
              exit 1
            fi
            cp -a "corpus/$sample" "samples/$sample"
          done
          install -m 0755 trusted/.github/ai-dogfood/sb.sh scratch/bin/sb
          echo "$GITHUB_WORKSPACE/scratch/bin" >> "$GITHUB_PATH"
          git -C pr rev-parse HEAD > /tmp/ai-dogfood/head_sha.txt
          echo "supabase-cli-dogfood-${GITHUB_RUN_ID}-" > /tmp/ai-dogfood/project-prefix.txt
          jq 'del(.["$schema"])' trusted/.github/ai-dogfood/report.schema.json \
            > /tmp/ai-dogfood/report.schema.json

      - name: Fetch PR diff and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr_number }}
        run: |
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > /tmp/ai-review/pr.diff
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,baseRefName,headRefName,additions,deletions,changedFiles \
            > /tmp/ai-review/pr.json

      # Token is written to a file the trusted wrapper reads. It is NOT exported
      # into this job's environment for later steps (Codex in particular).
      - name: Write staging token for sb wrapper
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_E2E_CLI_LIVE_STAGING_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SUPABASE_ACCESS_TOKEN" > scratch/.token

      - name: Run Codex dogfood
        # Pinned to v1.11, NOT v1.12: same hang regression as ai-review.yml
        # (openai/codex-action#150). workspace-write (not read-only): this
        # agent must write scratch files, reach api.supabase.green, and drive
        # Docker. drop-sudo still applies.
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        env:
          DOGFOOD_CLI_MAIN: ${{ github.workspace }}/pr/apps/cli/src/legacy/main.ts
          DOGFOOD_TOKEN_FILE: ${{ github.workspace }}/scratch/.token
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ github.workspace }}/trusted/.github/ai-dogfood/dogfood-prompt.md
          model: ${{ env.DOGFOOD_MODEL }}
          effort: medium
          output-schema-file: /tmp/ai-dogfood/report.schema.json
          output-file: /tmp/ai-dogfood/report.json
          codex-version: "0.150.1"
          working-directory: ${{ github.workspace }}/scratch
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Validate report or write crash stub
        if: always()
        working-directory: trusted
        env:
          REPORT_PATH: /tmp/ai-dogfood/report.json
          HEAD_SHA_FILE: /tmp/ai-dogfood/head_sha.txt
        run: |
          set -euo pipefail
          redact() {
            bun .github/scripts/ai-dogfood/post-report.ts redact "$REPORT_PATH" \
              || { rm -f "$REPORT_PATH"; exit 1; }
          }
          head_sha="$(tr -d '[:space:]' < "$HEAD_SHA_FILE" 2>/dev/null || echo unknown)"
          if bun .github/scripts/ai-dogfood/post-report.ts validate-report "$REPORT_PATH"; then
            redact
            exit 0
          fi
          echo "Dogfood report missing or invalid; writing crash stub." >&2
          HEAD_SHA="$head_sha" STUB_REASON="Dogfood agent crashed or produced invalid output." \
            bun .github/scripts/ai-dogfood/post-report.ts stub
          redact

      - name: Upload dogfood report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-report
          path: /tmp/ai-dogfood/report.json
          retention-days: 3

      - name: Cleanup leftover staging projects
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_E2E_CLI_LIVE_STAGING_ACCESS_TOKEN }}
        run: bash trusted/apps/cli/scripts/sweep-live-projects.sh "supabase-cli-dogfood-${GITHUB_RUN_ID}-"

  post-report:
    name: Post report
    needs:
      - resolve
      - dogfood
    if: ${{ !cancelled() && needs.resolve.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.trusted_ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Download dogfood report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogfood-report
          path: /tmp/ai-dogfood

      - name: Ensure report exists
        env:
          REPORT_PATH: /tmp/ai-dogfood/report.json
          HEAD_SHA: unknown
        run: |
          set -euo pipefail
          if [ ! -f "$REPORT_PATH" ]; then
            bun .github/scripts/ai-dogfood/post-report.ts stub
          fi

      - name: Post dogfood comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REPORT_PATH: /tmp/ai-dogfood/report.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOGFOOD_MODEL: ${{ env.DOGFOOD_MODEL }}
        run: bun .github/scripts/ai-dogfood/post-report.ts post

  dispatch-review:
    name: Dispatch AI review
    needs:
      - resolve
      - post-report
    if: ${{ !cancelled() && needs.resolve.outputs.should_run == 'true' && needs.post-report.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch ai-review.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.resolve.outputs.pr_number }}
        run: |
          gh workflow run ai-review.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f "pr=$PR"
