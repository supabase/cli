name: AI Dogfood and Review

# Functional dogfood of the PR CLI (GPT 5.6-luna), then dispatch the existing
# AI review pipeline with the report as runtime evidence. See
# .github/ai-dogfood/README.md for the design and security model.
#
# Two ways to trigger a run (shadow mode — no pull_request auto trigger):
#   - workflow_dispatch, with a same-repo PR number.
#   - an internal maintainer commenting `/ai-dogfood-and-review` on a PR.
# Forks are always refused.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to dogfood and review"
        required: true
        type: string
  issue_comment:
    types:
      - created

permissions: {}

env:
  DOGFOOD_MODEL: gpt-5.6-luna
  SUPABASE_LIVE_API_URL: https://api.supabase.green

# Ordinary issue_comment events fire this workflow for EVERY comment; give
# non-command comments their own per-run group so they cannot cancel an
# in-flight dogfood. Share the dogfood group for an exact command or that
# command plus a trailing body (`fromJSON` so the newline is a real LF).
concurrency:
  group: >-
    ai-dogfood-and-review-${{ github.event.issue.number || inputs.pr }}-${{
      (github.event_name == 'issue_comment' && github.event.comment.body != '/ai-dogfood-and-review' && !startsWith(github.event.comment.body, fromJSON('"/ai-dogfood-and-review\n"')) && !startsWith(github.event.comment.body, fromJSON('"/ai-dogfood-and-review\r\n"')))
        && github.run_id || 'dogfood' }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/ai-dogfood-and-review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      pull-requests: write
      contents: read
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      trigger: ${{ steps.resolve.outputs.trigger }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      # Dispatch uses the selected branch; comments always run default-branch code.
      trusted_ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - name: Resolve
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr || github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          RESOLVE_COMMAND: /ai-dogfood-and-review
          FORBID_FORKS_ON_MANUAL: "true"
        run: bun .github/scripts/ai-review/resolve.ts

  build-cli:
    name: Build PR CLI
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head (untrusted; CLI under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: pr
          persist-credentials: false

      - name: Checkout default branch (trusted; toolchain + install script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.trusted_ref }}
          path: trusted
          persist-credentials: false

      - name: Stage trusted toolchain files at workspace root
        run: |
          cp trusted/mise.toml trusted/mise.lock trusted/.bun-version trusted/package.json .

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "trusted/.bun-version"
          no-cache: true

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.0

      - name: Install PR workspace (no staging token)
        run: bash trusted/.github/ai-dogfood/install-pr-cli.sh "$GITHUB_WORKSPACE/pr"

      - name: Restore trusted tree after untrusted install
        run: git -C trusted reset --hard && git -C trusted clean -fdx

      - name: CLI --version
        env:
          DOGFOOD_CLI_MAIN: ${{ github.workspace }}/pr/apps/cli/src/main.ts
        run: bun --no-config "$DOGFOOD_CLI_MAIN" --version

  dogfood:
    name: Dogfood
    needs:
      - resolve
      - build-cli
    if: needs.resolve.outputs.should_run == 'true'
    # GitHub-hosted: openai/codex-action drop-sudo fails verification on
    # Blacksmith (`sudo -n` still succeeds), so Codex never starts.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head (untrusted; CLI under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: pr
          persist-credentials: false

      - name: Checkout default branch (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.trusted_ref }}
          path: trusted
          persist-credentials: false

      - name: Stage trusted toolchain files at workspace root
        run: |
          cp trusted/mise.toml trusted/mise.lock trusted/.bun-version trusted/package.json .

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "trusted/.bun-version"
          no-cache: true

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.0

      - name: Install PR workspace (no staging token)
        run: bash trusted/.github/ai-dogfood/install-pr-cli.sh "$GITHUB_WORKSPACE/pr"

      - name: Restore trusted tree after untrusted install
        run: git -C trusted reset --hard && git -C trusted clean -fdx

      - name: Docker preflight
        run: docker info

      - name: Read corpus SHA
        id: corpus
        run: echo "sha=$(tr -d '[:space:]' < trusted/.github/ai-dogfood/corpus.sha)" >> "$GITHUB_OUTPUT"

      - name: Checkout corpus (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matlin/supabase-config-real-world-samples
          ref: ${{ steps.corpus.outputs.sha }}
          path: corpus
          persist-credentials: false

      - name: Stage samples, scratch, and sb wrapper
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p samples scratch/bin /tmp/ai-review /tmp/ai-dogfood
          for sample in usebasejump__basejump vercel__nextjs-subscription-payments; do
            if [ ! -d "corpus/$sample" ]; then
              echo "::error::missing corpus sample $sample at pin ${{ steps.corpus.outputs.sha }}"
              exit 1
            fi
            cp -a "corpus/$sample" "samples/$sample"
          done
          install -m 0755 trusted/.github/ai-dogfood/sb.sh scratch/bin/sb
          echo "$GITHUB_WORKSPACE/scratch/bin" >> "$GITHUB_PATH"
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::missing harness HEAD SHA"
            exit 1
          fi
          printf '%s' "$HEAD_SHA" > /tmp/ai-dogfood/head_sha.txt
          printf '%s' "supabase-cli-dogfood-${GITHUB_RUN_ID}-" > /tmp/ai-dogfood/project-prefix.txt
          jq 'del(.["$schema"])' trusted/.github/ai-dogfood/report.schema.json \
            > /tmp/ai-dogfood/report.schema.json

      - name: Fetch PR diff and metadata
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          mkdir -p /tmp/ai-review
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,baseRefName,headRefName,additions,deletions,changedFiles \
            > /tmp/ai-review/pr.json
          base_ref=$(jq -r '.baseRefName' /tmp/ai-review/pr.json)
          bun .github/scripts/ai-review/generate-pr-diff.ts "$PR" "$base_ref" "$HEAD_SHA"

      # Token is written under RUNNER_TEMP for the trusted wrapper. It is NOT
      # exported into this job's environment for later steps (Codex in particular).
      # danger-full-access can still read RUNNER_TEMP; this is hygiene, not isolation.
      - name: Write staging token for sb wrapper
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_E2E_CLI_LIVE_STAGING_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_E2E_CLI_LIVE_STAGING_ACCESS_TOKEN is empty"
            exit 1
          fi
          umask 077
          printf '%s' "$SUPABASE_ACCESS_TOKEN" > "${RUNNER_TEMP}/dogfood.token"

      - name: Run Codex dogfood
        # Pinned to v1.11, NOT v1.12: same hang regression as ai-review.yml
        # (openai/codex-action#150). drop-sudo still applies. workspace-write
        # blocks outbound network and the Docker socket by default, so this
        # agent cannot reach api.supabase.green or `db start`; danger-full-access
        # is the documented fallback (never read-only).
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        env:
          DOGFOOD_CLI_MAIN: ${{ github.workspace }}/pr/apps/cli/src/main.ts
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ github.workspace }}/trusted/.github/ai-dogfood/dogfood-prompt.md
          model: ${{ env.DOGFOOD_MODEL }}
          effort: medium
          output-schema-file: /tmp/ai-dogfood/report.schema.json
          output-file: /tmp/ai-dogfood/report.json
          codex-version: "0.150.1"
          working-directory: ${{ github.workspace }}/scratch
          safety-strategy: drop-sudo
          sandbox: danger-full-access

      # Full-access agent could rewrite trusted/; drop that tree and clone
      # again before validate/redact. Same-runner bun remains residual;
      # post-report re-redacts on a fresh runner.
      - name: Remove agent-writable trusted tree
        if: always()
        run: rm -rf trusted

      - name: Restore trusted tree after Codex
        id: restore-trusted
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.trusted_ref }}
          path: trusted
          persist-credentials: false

      - name: Validate report or write crash stub
        id: redact
        if: ${{ always() && steps.restore-trusted.outcome == 'success' }}
        working-directory: trusted
        env:
          REPORT_PATH: /tmp/ai-dogfood/report.json
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          redact() {
            bun .github/scripts/ai-dogfood/post-report.ts redact "$REPORT_PATH" \
              || { rm -f "$REPORT_PATH"; exit 1; }
          }
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::missing harness HEAD SHA"
            exit 1
          fi
          if bun .github/scripts/ai-dogfood/post-report.ts validate-report "$REPORT_PATH"; then
            jq --arg sha "$HEAD_SHA" '.head_sha = $sha' "$REPORT_PATH" > "${REPORT_PATH}.stamped"
            mv "${REPORT_PATH}.stamped" "$REPORT_PATH"
            redact
            exit 0
          fi
          echo "Dogfood report missing or invalid; writing crash stub." >&2
          STUB_REASON="Dogfood agent crashed or produced invalid output." \
            bun .github/scripts/ai-dogfood/post-report.ts stub
          redact

      - name: Upload dogfood report
        if: ${{ always() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-report
          path: /tmp/ai-dogfood/report.json
          retention-days: 3

      - name: Cleanup leftover staging projects
        if: ${{ always() && steps.restore-trusted.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_E2E_CLI_LIVE_STAGING_ACCESS_TOKEN }}
        run: bash trusted/apps/cli/scripts/sweep-live-projects.sh "supabase-cli-dogfood-${GITHUB_RUN_ID}-"

  sweep:
    name: Sweep staging projects
    needs:
      - resolve
      - dogfood
    # Separate runner so a dogfood job timeout still cleans the prefix.
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.trusted_ref }}
          persist-credentials: false
      - name: Sweep leftover staging projects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_E2E_CLI_LIVE_STAGING_ACCESS_TOKEN }}
        run: bash apps/cli/scripts/sweep-live-projects.sh "supabase-cli-dogfood-${GITHUB_RUN_ID}-"

  post-report:
    name: Post report
    needs:
      - resolve
      - dogfood
    if: ${{ !cancelled() && needs.resolve.outputs.should_run == 'true' && needs.dogfood.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.trusted_ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Download dogfood report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogfood-report
          path: /tmp/ai-dogfood

      - name: Ensure report exists
        env:
          REPORT_PATH: /tmp/ai-dogfood/report.json
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ ! -f "$REPORT_PATH" ]; then
            if [ -z "${HEAD_SHA}" ]; then
              echo "::error::missing dogfood report and PR head SHA"
              exit 1
            fi
            bun .github/scripts/ai-dogfood/post-report.ts stub
          fi

      - name: Redact report
        env:
          REPORT_PATH: /tmp/ai-dogfood/report.json
        run: bun .github/scripts/ai-dogfood/post-report.ts redact "$REPORT_PATH"

      - name: Post dogfood comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REPORT_PATH: /tmp/ai-dogfood/report.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOGFOOD_MODEL: ${{ env.DOGFOOD_MODEL }}
        run: bun .github/scripts/ai-dogfood/post-report.ts post

  dispatch-review:
    name: Dispatch AI review
    needs:
      - resolve
      - post-report
    if: ${{ !cancelled() && needs.resolve.outputs.should_run == 'true' && needs.post-report.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch ai-review.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.resolve.outputs.pr_number }}
        run: |
          gh workflow run ai-review.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f "pr=$PR"
