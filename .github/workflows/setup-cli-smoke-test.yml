name: setup-cli Smoke Test

# Smoke test for the `supabase/setup-cli` GitHub Action against a specific published CLI
# version. Runs automatically after every published release and also manually via
# workflow_dispatch when debugging setup-cli regressions. Catches regressions like
# supabase/setup-cli#427, where musl libc + archive layout changes silently broke the action on
# Alpine. v3 installs from npm: each v3 runner first waits until npm serves the version, and the
# job warns if setup-cli fell back to the GitHub release. A separate job forces that fallback.

on:
  workflow_call:
    inputs:
      version:
        description: Supabase CLI version to install via setup-cli (must already be published to GitHub Releases and npm)
        required: true
        type: string
    outputs:
      npm_fallback:
        description: "'true' when any v3 job installed from the GitHub release because the npm install failed"
        value: ${{ jobs.summary.outputs.npm_fallback }}
  workflow_dispatch:
    inputs:
      version:
        description: Supabase CLI version to install via setup-cli (must already be published to GitHub Releases and npm)
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup-cli-smoke-test:
    name: setup-cli ${{ matrix.major-version }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # GitHub Actions doesn't allow expressions in `uses:`, so the action ref is selected via
        # `if:`-gated install steps below instead of interpolating `matrix.major-version`.
        major-version:
          - v1
          - v2
          - v3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Install Supabase CLI via setup-cli@v1
        if: matrix.major-version == 'v1'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ inputs.version }}
      - name: Install Supabase CLI via setup-cli@v2
        if: matrix.major-version == 'v2'
        uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: ${{ inputs.version }}
      - name: Checkout the npm wait script
        if: matrix.major-version == 'v3'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .smoke-tooling
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Wait for npm to serve the version
        if: matrix.major-version == 'v3'
        shell: bash
        run: |
          set -euo pipefail
          platform="$(node -p 'process.platform + "-" + process.arch')"
          bash .smoke-tooling/.github/scripts/wait-for-npm-version.sh "${VERSION#v}" supabase "@supabase/cli-${platform/win32/windows}"
      - name: Install Supabase CLI via setup-cli@v3
        id: setup-cli-v3
        if: matrix.major-version == 'v3'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ inputs.version }}
      - name: Verify supabase --version matches the expected version
        shell: bash
        run: |
          set -euo pipefail
          # `supabase --version` prints the version without the leading `v`,
          # while release tags / setup-cli inputs include it, so strip it
          # before comparing.
          expected="${VERSION#v}"
          actual="$(supabase --version | tr -d '\r' | head -n1)"
          echo "supabase --version: ${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "Version mismatch: expected ${expected}, got ${actual}" >&2
            exit 1
          fi
      - name: Warn if setup-cli fell back from npm
        id: npm-source
        if: matrix.major-version == 'v3'
        shell: bash
        env:
          INSTALL_SOURCE: ${{ steps.setup-cli-v3.outputs.install-source }}
        run: |
          set -euo pipefail
          if [ "${INSTALL_SOURCE}" != "npm" ]; then
            echo "::warning::setup-cli fell back to ${INSTALL_SOURCE} because installing supabase@${VERSION#v} from npm failed; check the setup-cli step log"
            echo "${INSTALL_SOURCE}" > npm-fallback.txt
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Record the npm fallback
        if: steps.npm-source.outputs.fallback == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-fallback-v3-${{ matrix.runner }}
          path: npm-fallback.txt

  # A separate job because GitHub Actions only honours `container:` on Linux runners, and mixing
  # container + non-container entries in one matrix is fragile when the value is empty. The
  # musl-vs-glibc + archive layout regressions from supabase/setup-cli#427 only reproduce inside
  # a real Alpine container.
  setup-cli-smoke-test-alpine:
    name: setup-cli ${{ matrix.major-version }} (alpine)
    strategy:
      fail-fast: false
      matrix:
        major-version:
          - v1
          - v2
          - v3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `node:20-alpine` ships a musl-linked Node, required for JavaScript-based actions to launch
    # here — the runner's mounted glibc Node won't execute inside an Alpine container.
    container:
      # The image is pinned by tag, not by digest. It only hosts the installer smoke test, and
      # nothing would update a digest here automatically.
      # jactionlint ignore=unpinned-images
      image: node:20-alpine
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Install Alpine prerequisites
        run: apk add --no-cache bash curl git jq tar
      - name: Install Supabase CLI via setup-cli@v1
        if: matrix.major-version == 'v1'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ inputs.version }}
      - name: Install Supabase CLI via setup-cli@v2
        if: matrix.major-version == 'v2'
        uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: ${{ inputs.version }}
      - name: Checkout the npm wait script
        if: matrix.major-version == 'v3'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .smoke-tooling
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Wait for npm to serve the version
        if: matrix.major-version == 'v3'
        shell: bash
        run: |
          set -euo pipefail
          platform="$(node -p 'process.platform + "-" + process.arch')"
          bash .smoke-tooling/.github/scripts/wait-for-npm-version.sh "${VERSION#v}" supabase "@supabase/cli-${platform}-musl"
      - name: Install Supabase CLI via setup-cli@v3
        id: setup-cli-v3
        if: matrix.major-version == 'v3'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ inputs.version }}
      - name: Verify supabase --version matches the expected version
        shell: bash
        run: |
          set -euo pipefail
          # `supabase --version` prints the version without the leading `v`,
          # while release tags / setup-cli inputs include it, so strip it
          # before comparing.
          expected="${VERSION#v}"
          actual="$(supabase --version | tr -d '\r' | head -n1)"
          echo "supabase --version: ${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "Version mismatch: expected ${expected}, got ${actual}" >&2
            exit 1
          fi
      - name: Warn if setup-cli fell back from npm
        id: npm-source
        if: matrix.major-version == 'v3'
        shell: bash
        env:
          INSTALL_SOURCE: ${{ steps.setup-cli-v3.outputs.install-source }}
        run: |
          set -euo pipefail
          if [ "${INSTALL_SOURCE}" != "npm" ]; then
            echo "::warning::setup-cli fell back to ${INSTALL_SOURCE} because installing supabase@${VERSION#v} from npm failed; check the setup-cli step log"
            echo "${INSTALL_SOURCE}" > npm-fallback.txt
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Record the npm fallback
        if: steps.npm-source.outputs.fallback == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-fallback-v3-alpine
          path: npm-fallback.txt

  setup-cli-smoke-test-github-release:
    name: setup-cli v3 GitHub release fallback (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      # An npm executable that always fails sends setup-cli down its GitHub release fallback.
      SUPABASE_SETUP_CLI_NPM: "false"
    steps:
      - name: Install Supabase CLI via setup-cli@v3
        id: setup-cli-v3
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ inputs.version }}
      - name: Verify supabase --version matches the expected version
        shell: bash
        run: |
          set -euo pipefail
          # `supabase --version` prints the version without the leading `v`,
          # while release tags / setup-cli inputs include it, so strip it
          # before comparing.
          expected="${VERSION#v}"
          actual="$(supabase --version | tr -d '\r' | head -n1)"
          echo "supabase --version: ${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "Version mismatch: expected ${expected}, got ${actual}" >&2
            exit 1
          fi
      - name: Verify setup-cli installed from the GitHub release
        shell: bash
        env:
          INSTALL_SOURCE: ${{ steps.setup-cli-v3.outputs.install-source }}
        run: |
          set -euo pipefail
          if [ "${INSTALL_SOURCE}" != "github-release" ]; then
            echo "::error::setup-cli installed from ${INSTALL_SOURCE} instead of falling back to the GitHub release with npm disabled"
            exit 1
          fi

  summary:
    name: setup-cli npm fallback summary
    needs: [setup-cli-smoke-test, setup-cli-smoke-test-alpine]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      npm_fallback: ${{ steps.fallbacks.outputs.npm_fallback }}
    steps:
      - id: fallbacks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          count="$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[].name' | grep -c '^npm-fallback-' || true)"
          echo "npm_fallback=$([ "${count}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
