# TEMPORARY diagnostic workflow — validates the binfmt_misc root cause and fix
# on a real Blacksmith runner. Delete before merging the PR.
#
# It force-unmounts /proc/sys/fs/binfmt_misc to deterministically simulate a
# COLD Blacksmith VM (the only state where the bug reproduces), so the result
# is meaningful even if Blacksmith hands us a warm/reused VM. It then:
#   - reproduces the failure (QEMU without the host mount -> arm64 unavailable)
#   - proves the fix (mount binfmt_misc on the host -> arm64 runs)
name: debug-binfmt-arm64

on:
  push:
    branches:
      - ci/fix-binfmt-mount-cold-runner
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  debug:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup (mirror smoke-test job — dependency firewall)
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: 0 — Baseline binfmt_misc state
        run: |
          echo "::group::Baseline"
          mountpoint /proc/sys/fs/binfmt_misc && echo "MOUNTED" || echo "NOT MOUNTED"
          ls /proc/sys/fs/binfmt_misc/ 2>&1 | head -40 || true
          docker info --format '{{.DriverStatus}}'
          echo "::endgroup::"

      - name: 1 — Enable containerd image store (match real job)
        run: |
          set -euo pipefail
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.DriverStatus}}'

      - name: 2 — Simulate COLD VM (force-unmount binfmt_misc)
        run: |
          set -x
          sudo umount /proc/sys/fs/binfmt_misc 2>&1 || echo "(was not mounted)"
          if mountpoint -q /proc/sys/fs/binfmt_misc; then
            echo "still MOUNTED (could not simulate cold)"
          else
            echo "NOT MOUNTED — cold VM simulated"
          fi

      - name: 3 — Setup QEMU WITHOUT host mount (reproduce bug)
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: 4 — Probe arm64 — EXPECT FAILURE on a cold VM
        id: broken
        continue-on-error: true
        run: |
          set -x
          ls /proc/sys/fs/binfmt_misc/ 2>&1 | head -40 || true
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 2>&1 || echo "NO qemu-aarch64 handler on host"
          docker run --rm --platform linux/arm64 alpine:3.21 uname -m

      - name: 5 — Report reproduction outcome
        run: |
          echo "arm64 probe WITHOUT host mount: outcome=${{ steps.broken.outcome }}"
          echo "(expected 'failure' — confirms the unmounted-binfmt_misc root cause)"

      - name: 6 — Apply FIX — mount binfmt_misc on the host
        run: |
          set -euo pipefail
          if ! mountpoint -q /proc/sys/fs/binfmt_misc; then
            sudo modprobe binfmt_misc || true
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          mountpoint /proc/sys/fs/binfmt_misc

      - name: 7 — Setup QEMU WITH host mount
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: 8 — Probe arm64 — EXPECT SUCCESS (validates the fix)
        run: |
          set -euo pipefail
          grep -q enabled /proc/sys/fs/binfmt_misc/qemu-aarch64
          docker pull --platform linux/arm64 alpine:3.21
          out=$(docker run --rm --platform linux/arm64 alpine:3.21 uname -m)
          echo "arm64 'uname -m' => $out"
          test "$out" = "aarch64"
          echo "FIX VALIDATED: arm64 emulation works after mounting binfmt_misc on the host"
