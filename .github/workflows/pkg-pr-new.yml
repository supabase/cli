name: pkg.pr.new

on:
  workflow_run:
    workflows:
      - Build Preview CLI Packages
    types:
      - completed

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pkg-pr-new-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish preview package
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve publish context
        id: context
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          should_publish=false
          preview_build_run_id="$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")"

          if ! gh run download "${preview_build_run_id}" --name preview-context --dir preview-context; then
            echo "No preview context artifact found on Build Preview CLI Packages run ${preview_build_run_id}; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_number="$(jq -r '.pr_number // ""' preview-context/preview-context.json)"
          pr_head_sha="$(jq -r '.pr_head_sha // ""' preview-context/preview-context.json)"
          preview_version="$(jq -r '.preview_version // ""' preview-context/preview-context.json)"

          if [[ -z "${pr_number}" || -z "${pr_head_sha}" || -z "${preview_version}" ]]; then
            echo "Preview context artifact is missing required data; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          current_head_sha="$(jq -r '.head.sha' <<< "${pr_json}")"
          state="$(jq -r '.state' <<< "${pr_json}")"
          draft="$(jq -r '.draft' <<< "${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "${pr_json}")"
          base_repo="$(jq -r '.base.repo.full_name' <<< "${pr_json}")"

          if [[ "${state}" != "open" ]]; then
            echo "PR #${pr_number} is ${state}; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${draft}" == "true" ]]; then
            echo "PR #${pr_number} is draft; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${head_repo}" != "${base_repo}" ]]; then
            echo "PR #${pr_number} comes from fork ${head_repo}; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${pr_head_sha}" != "${current_head_sha}" ]]; then
            echo "Workflow SHA ${pr_head_sha} is stale; current PR head is ${current_head_sha}. Skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          artifact_name="$(
            gh api "repos/${REPOSITORY}/actions/runs/${preview_build_run_id}/artifacts" \
              --paginate \
              --jq '.artifacts[] | select(.name | startswith("cli-build-legacy-")) | .name' \
              | head -n 1
          )"

          if [[ -z "${artifact_name}" ]]; then
            echo "No legacy CLI build artifact found on Build Preview CLI Packages run ${preview_build_run_id}; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          artifact_version="${artifact_name#cli-build-legacy-}"
          if [[ "${artifact_version}" != "${preview_version}" ]]; then
            echo "Preview context version ${preview_version} does not match artifact version ${artifact_version}; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          should_publish=true

          {
            echo "should_publish=${should_publish}"
            echo "pr_number=${pr_number}"
            echo "pr_head_sha=${pr_head_sha}"
            echo "preview_version=${preview_version}"
            echo "artifact_name=${artifact_name}"
            echo "preview_build_run_id=${preview_build_run_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.context.outputs.should_publish == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.context.outputs.pr_head_sha }}
          persist-credentials: false

      - name: Setup
        if: steps.context.outputs.should_publish == 'true'
        uses: ./.github/actions/setup

      - name: Download preview build artifacts
        if: steps.context.outputs.should_publish == 'true'
        run: gh run download "${PREVIEW_BUILD_RUN_ID}" --name "${ARTIFACT_NAME}"
        env:
          ARTIFACT_NAME: ${{ steps.context.outputs.artifact_name }}
          PREVIEW_BUILD_RUN_ID: ${{ steps.context.outputs.preview_build_run_id }}

      - name: Prepare package files
        if: steps.context.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          pnpm exec bun apps/cli/scripts/sync-versions.ts --version "${PREVIEW_VERSION}"
          pnpm --dir apps/cli build:shim
          find packages -path '*/bin/supabase*' -type f -exec chmod +x {} +
        env:
          PREVIEW_VERSION: ${{ steps.context.outputs.preview_version }}

      - name: Publish preview package
        id: publish
        if: steps.context.outputs.should_publish == 'true'
        run: |
          pnpm exec pkg-pr-new publish \
            --pnpm \
            --bin \
            --comment=off \
            --json pkg-pr-new.json \
            --no-template \
            './packages/cli-darwin-arm64' \
            './packages/cli-darwin-x64' \
            './packages/cli-linux-arm64' \
            './packages/cli-linux-arm64-musl' \
            './packages/cli-linux-x64' \
            './packages/cli-linux-x64-musl' \
            './packages/cli-windows-arm64' \
            './packages/cli-windows-x64' \
            './apps/cli'

      - name: Smoke test preview command
        if: steps.context.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          preview_url="https://pkg.pr.new/supabase@${PR_NUMBER}"
          npx --yes "${preview_url}" --version
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}

      - name: Update PR comment
        if: steps.context.outputs.should_publish == 'true'
        env:
          PR_HEAD_SHA: ${{ steps.context.outputs.pr_head_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          PREVIEW_VERSION: ${{ steps.context.outputs.preview_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          preview_url="https://pkg.pr.new/supabase@${PR_NUMBER}"
          short_sha="${PR_HEAD_SHA:0:7}"
          marker="<!-- pkg-pr-new-preview -->"
          cat > comment.md <<EOF
          ${marker}
          ## pkg.pr.new preview

          Published version \`${PREVIEW_VERSION}\` from commit [\`${short_sha}\`](https://github.com/${REPOSITORY}/commit/${PR_HEAD_SHA}) after the PR test and preview build workflows passed.

          \`\`\`sh
          npx ${preview_url}
          \`\`\`
          EOF

          jq -n --rawfile body comment.md '{ body: $body }' > comment.json
          comment_id="$(
            gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq '.[] | select(.body | contains("'"${marker}"'")) | .id' \
              | head -n1
          )"

          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" --input comment.json >/dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --input comment.json >/dev/null
          fi
