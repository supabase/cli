name: Mirror template images

# Keeps the ghcr.io/ECR mirror in sync with the image versions pinned in
# apps/cli-go/pkg/config/templates/Dockerfile (the single source of truth for
# `config.Images`). When the Dockerfile changes, this workflow detects any tag
# that is not yet mirrored and backfills it the same way
# `cli-go-mirror-image.yml` does.
#
# Dependabot branch pushes are the automatic PR path; they have the
# permissions needed to mirror images without using `pull_request_target`.
# `workflow_dispatch` remains available as a manual fallback, while pushes to
# `develop` provide post-merge synchronization.

on:
  push:
    branches:
      - develop
      - dependabot/docker/**
    paths:
      - apps/cli-go/pkg/config/templates/Dockerfile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-template-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect unmirrored images
    # Keep develop pushes and manual dispatch available, but only trust the
    # Dependabot actor for the automatic branch-push path.
    if: github.event_name != 'push' || github.ref == 'refs/heads/develop' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      missing: ${{ steps.detect.outputs.missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Parses the Dockerfile, checks each image against the mirror, and writes
      # `missing=<json>` to $GITHUB_OUTPUT. Idempotent: already-mirrored images
      # are skipped, so a re-run produces an empty list.
      - name: Detect images missing from the mirror
        id: detect
        run: pnpm exec bun apps/cli/scripts/detect-unmirrored-images.ts

  mirror:
    name: Mirror image
    needs: detect
    if: needs.detect.outputs.missing != '' && needs.detect.outputs.missing != '[]'
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.missing) }}
    # Reuse the existing mirror logic (docker.io -> public.ecr.aws + ghcr.io).
    uses: ./.github/workflows/cli-go-mirror-image.yml
    with:
      image: ${{ matrix.image }}
    secrets:
      PROD_AWS_ROLE: ${{ secrets.PROD_AWS_ROLE }}
