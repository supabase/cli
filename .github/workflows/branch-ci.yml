name: branch-ci

# Runs the Test suite on pushes to stack-architecture branches, which have no PR yet.
on:
  push:
    branches:
      - stack-architecture
      - stack-architecture/**

permissions:
  actions: read
  contents: read

concurrency:
  group: branch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    with:
      force: true
    secrets:
      DF_FIREWALL_TOKEN: ${{ secrets.DF_FIREWALL_TOKEN }}
