name: Investigate native Functions startup

on:
  push:
    branches:
      - investigate/native-functions-startup-2026-09-24

permissions:
  actions: read
  contents: read

jobs:
  reproduce:
    name: Cached native eager startup
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Download the original compiled CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-cli-linux-x64
          path: ${{ runner.temp }}/compiled-cli
          run-id: 36025594314
          github-token: ${{ github.token }}

      - name: Install compiled CLI
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostic-bin"
          tar -xzf "$RUNNER_TEMP/compiled-cli/compiled-cli.tar.gz" -C "$RUNNER_TEMP/diagnostic-bin"
          chmod +x "$RUNNER_TEMP/diagnostic-bin/supabase"
          "$RUNNER_TEMP/diagnostic-bin/supabase" --version
          cp "$RUNNER_TEMP/compiled-cli/benchmark-runner.json" "$RUNNER_TEMP/benchmark-runner.json"

      - name: Disable Docker for native runtime
        run: |
          sudo systemctl stop docker.service docker.socket
          if docker --host unix:///tmp/benchmark-no-docker.sock info >/dev/null 2>&1; then
            echo "Docker unexpectedly responded on the unavailable endpoint" >&2
            exit 1
          fi
          echo "DOCKER_HOST=unix:///tmp/benchmark-no-docker.sock" >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Reproduce up to 20 cached starts
        env:
          COMPILED_CLI: ${{ runner.temp }}/diagnostic-bin/supabase
        run: python3 scripts/diagnostics/native-functions.py

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-functions-startup-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-functions-diagnostics/summary.json
            ${{ runner.temp }}/native-functions-diagnostics/build-runner.json
            ${{ runner.temp }}/native-functions-diagnostics/logs/**
          if-no-files-found: warn
          retention-days: 14
