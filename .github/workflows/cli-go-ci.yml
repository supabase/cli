name: CI

on:
  pull_request:
    paths:
      - apps/cli-go/**
  merge_group:
  push:
    branches:
      - develop
    paths:
      - apps/cli-go/**

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli-go/go.mod
          cache: true

      # Required by: internal/utils/credentials/keyring_test.go
      - uses: t1m0thyj/unlock-keyring@cbcf205c879ebd86add70bab3a6abfcce59a5cae # v1.2.0
      - run: |
          pkgs=$(go list ./pkg/... | grep -Ev 'pkg/api' | paste -sd ',' -)
          go tool gotestsum -- -race -v -count=1 ./... \
          -coverpkg="./cmd/...,./internal/...,${pkgs}" -coverprofile=coverage.out

      - name: Check existing coverage cache
        id: coverage-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/cli-go/coverage.out
          key: cli-go-coverage-${{ github.run_id }}-v1
          lookup-only: true

      - name: Save coverage cache
        if: steps.coverage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/cli-go/coverage.out
          key: cli-go-coverage-${{ github.run_id }}-v1

  coverage:
    name: Coverage
    needs:
      - test
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Restore coverage cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/cli-go/coverage.out
          key: cli-go-coverage-${{ github.run_id }}-v1
          fail-on-cache-miss: true
      - name: Move coverage report
        run: cp apps/cli-go/coverage.out coverage.out
        working-directory: .
      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.out
          format: golang

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          version: 2026.7.0
          install: true
          install_args: >-
            go
            golangci-lint

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout 5m --verbose
          install-mode: none
          only-new-issues: true
          working-directory: apps/cli-go

  start:
    name: Start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli-go/go.mod
          cache: true
      - run: go build main.go
      # The bundled/release build excludes internal/start -- see
      # apps/cli/docs/binary-distribution.md § Bundled build tag (CLI-1966).
      # These steps verify that build alongside the untagged tree below,
      # which remains the migration's parity oracle for Go's `start`.
      - run: go build -tags bundled -o main-bundled .
      - name: Verify bundled build excludes internal/start's dependency tree
        run: |
          set -euo pipefail
          go list -tags bundled -deps . > /tmp/bundled-deps.txt
          ! grep -Eq \
            'docker/compose|docker/buildx|moby/buildkit|k8s\.io/client-go|aws-sdk-go-v2' \
            /tmp/bundled-deps.txt
      - name: Verify bundled build keeps start's command/flag/completion surface
        run: |
          set -euo pipefail
          diff <(./main start --help) <(./main-bundled start --help)
          diff <(./main __complete start --) <(./main-bundled __complete start --)
      - name: Verify bundled build stubs start
        run: |
          set -euo pipefail
          set +e
          output="$(./main-bundled start 2>&1)"
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "expected the bundled build's \`start\` to exit non-zero, got 0:" >&2
            echo "$output" >&2
            exit 1
          fi
          if ! grep -q "not available in supabase-go" <<<"$output"; then
            echo "expected the bundled build's \`start\` to fail with the CLI-1966 stub message; got:" >&2
            echo "$output" >&2
            exit 1
          fi
          echo "bundled build correctly stubs \`start\` (exit $exit_code)"
          ./main-bundled --help >/dev/null
      - run: ./main init
      - run: sed -i '/\[db.pooler\]/{n;s/.*/enabled = true/}' supabase/config.toml
      - run: ./main start --workdir tests
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      - name: Install websocat
        run: |
          sudo wget -qO /usr/local/bin/websocat https://github.com/vi/websocat/releases/latest/download/websocat.x86_64-unknown-linux-musl
          sudo chmod a+x /usr/local/bin/websocat
          websocat --version
      - run: ./e2e-test.sh ./main

  link:
    name: Link
    if: ${{ github.event_name == 'merge_group' || (github.event_name ==
      'pull_request' && !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli-go/go.mod
          cache: true
      - run: go build main.go
      - run: ./main link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  codegen:
    name: Codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli-go/go.mod
          cache: true

      - run: go generate
      - run: |
          if ! git diff --ignore-space-at-eol --exit-code --quiet pkg; then
            echo "Detected uncommitted changes after codegen. See status below:"
            git diff
            exit 1
          fi
defaults:
  run:
    working-directory: apps/cli-go
