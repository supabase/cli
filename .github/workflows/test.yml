name: Test

# Release-notes PRs (head ref `release-notes/*`) only add markdown under
# `release-notes/` and are published via approval — skip the full CI suite.
#
# Default path: ready (non-draft) PRs targeting `develop`, plus the merge queue.
# `run-ci.yml` calls this workflow for drafts and stacked / non-develop PRs.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    branches:
      - develop
  merge_group:
    types:
      - checks_requested
    branches:
      - develop
  workflow_call:
    inputs:
      force:
        description: Run the suite even when the PR is a draft (used by run-ci.yml)
        type: boolean
        default: false
    secrets:
      DF_FIREWALL_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

# Literal prefix: called workflows inherit github.workflow from the caller
# (`run-ci`), which would cancel the caller and the preview call. `inputs.force`
# keeps a skipped native Test run on a develop draft from cancelling the
# forced run-ci call.
concurrency:
  group: test.yml-${{ github.event.pull_request.number || github.head_ref || github.ref }}-${{ inputs.force && 'run-ci' || 'direct' }}
  cancel-in-progress: true

jobs:
  check:
    if: |
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Check code quality
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}
      - name: Unlock keyring (for cli-go keyring tests)
        uses: t1m0thyj/unlock-keyring@cbcf205c879ebd86add70bab3a6abfcce59a5cae # v1.2.0

      - name: Check code quality
        run: pnpm run check:all

      # Advisory only (base-vs-head diff, no acceptance artifact to gate a
      # required check on) — the hard release-time gate is
      # tools/config-release-gate.ts in release-config.yml (CLI-2233).
      # `continue-on-error` flags the diff without failing the job;
      # the tool's own fetch/unshallow fallback resolves a merge-base from
      # this checkout's shallow clone, and skips the compare (exit 0) rather
      # than failing when history still can't be resolved.
      - name: config type-surface diff (advisory)
        continue-on-error: true
        run: pnpm run check:config-api

  # Path gate for the test jobs. Docs-only and release-notes-only changes skip
  # every test job; Go-only changes skip unit and integration but keep e2e,
  # which shells out to the Go sidecar binary; anything under .github or a
  # TypeScript workspace runs everything. `check` is never gated. The summary
  # jobs fail if this job does not succeed, so a broken gate cannot turn into
  # a false green (ADR 0024).
  changes:
    if: |
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      go: ${{ steps.filter.outputs.go }}
      ci: ${{ steps.filter.outputs.ci }}
      shard-weights: ${{ steps.shard-weights.outputs.cache-matched-key != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ts:
              - "apps/cli/**"
              - "apps/cli-e2e/**"
              - "packages/**"
              - "tools/**"
              - "patches/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.json"
              - "mise.toml"
              - "mise.lock"
              - ".bun-version"
              - "vitest.*"
            go:
              - "apps/cli-go/**"
            ci:
              - ".github/**"

      # Shard weights are develop's last per-file durations (develop-tests.yml).
      # Restore them once here and hand them to every shard as a run artifact:
      # shards must partition from identical input, and a prefix restore in
      # each shard could pick up different cache generations. No cache means
      # the sequencer falls back to dealing files by count.
      - name: Restore shard weights
        id: shard-weights
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vitest/shard-weights.json
          key: vitest-shard-weights-${{ github.sha }}
          restore-keys: |
            vitest-shard-weights-

      - name: Publish shard weights for this run
        if: steps.shard-weights.outputs.cache-matched-key != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-weights
          path: .vitest/shard-weights.json
          retention-days: 1

  # One root Vitest run over the unit and integration kinds of every package,
  # split across two runners by the balanced sequencer in vitest.config.mts.
  # The summary job below keeps the required check name stable (ADR 0024).
  test:
    needs: changes
    if: |
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false) &&
      (needs.changes.outputs.ts == 'true' || needs.changes.outputs.ci == 'true')
    name: Run unit and integration tests (shard ${{ matrix.shard }}/2)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Restore Vitest module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: vitest-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Use shard weights from develop
        if: needs.changes.outputs.shard-weights == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shard-weights
          path: .vitest

      - name: Run unit and integration tests
        run: pnpm run test --shard=${{ matrix.shard }}/2

  test-summary:
    if: |
      always() &&
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Run unit and integration tests
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify unit and integration tests succeeded
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error ::Path gate did not succeed: changes=${{ needs.changes.result }}"
            exit 1
          fi
          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.test.result }}" = "cancelled" ]; then
            echo "::error ::One or more unit/integration shards failed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All unit/integration shards reported: ${{ needs.test.result }}"

  test-e2e:
    needs: changes
    if: |
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false) &&
      (needs.changes.outputs.ts == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true')
    name: Run end-to-end tests (shard ${{ matrix.shard }}/3)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.0.0-beta
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Cache Go CLI binary
        id: cache-go-binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/cli-go/supabase-go
          key: go-cli-${{ runner.os }}-${{ hashFiles('apps/cli-go/**/*.go',
            'apps/cli-go/go.mod', 'apps/cli-go/go.sum') }}

      - name: Build Go CLI
        if: steps.cache-go-binary.outputs.cache-hit != 'true'
        run: go build -o supabase-go .
        working-directory: apps/cli-go

      - name: Restore Vitest module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: vitest-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # The ts-legacy harness invokes `node apps/cli/dist/supabase.js` with
      # `SUPABASE_CLI_BINARY_OVERRIDE` pointing at the compiled legacy binary
      # in `apps/cli/dist/`. The root e2e task depends on `supabase#build`, so
      # Turbo builds the CLI first; one root Vitest run then covers every
      # package's e2e projects and the balanced sequencer decides the shard.
      - name: Use shard weights from develop
        if: needs.changes.outputs.shard-weights == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shard-weights
          path: .vitest

      - name: Run end-to-end tests
        run: pnpm run test:e2e --shard=${{ matrix.shard }}/3
        env:
          CLI_HARNESS_TARGET: ts-legacy
          SUPABASE_GO_BINARY: ${{ github.workspace }}/apps/cli-go/supabase-go

  # Summary job that gates branch protection.  The matrix `test-e2e` job
  # produces per-shard check names (`Run end-to-end tests (shard N/3)`), so
  # this job preserves the original `Run end-to-end tests` check name that
  # branch protection rules already require.  It succeeds iff every shard
  # succeeded (or skipped — `success()` is true for skipped jobs).
  test-e2e-summary:
    if: |
      always() &&
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Run end-to-end tests
    needs: [changes, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all shards succeeded
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error ::Path gate did not succeed: changes=${{ needs.changes.result }}"
            exit 1
          fi
          if [ "${{ needs.test-e2e.result }}" = "failure" ] || [ "${{ needs.test-e2e.result }}" = "cancelled" ]; then
            echo "::error ::One or more e2e shards failed: ${{ needs.test-e2e.result }}"
            exit 1
          fi
          echo "All e2e shards reported: ${{ needs.test-e2e.result }}"
