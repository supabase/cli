name: Test

# Release-notes PRs (head ref `release-notes/*`) only add markdown under
# `release-notes/` and are published via approval — skip the full CI suite.
#
# Default path: ready (non-draft) PRs targeting `develop`, plus the merge queue.
# `run-ci.yml` calls this workflow for drafts and stacked / non-develop PRs.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    branches:
      - develop
  merge_group:
    types:
      - checks_requested
    branches:
      - develop
  workflow_call:
    inputs:
      force:
        description: Run the suite even when the PR is a draft (used by run-ci.yml)
        type: boolean
        default: false
    secrets:
      DF_FIREWALL_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

# Literal prefix: called workflows inherit github.workflow from the caller
# (`run-ci`), which would cancel the caller. `inputs.force` keeps a skipped
# native Test run on a develop draft from cancelling the forced run-ci call.
concurrency:
  group: test.yml-${{ github.event.pull_request.number || github.head_ref || github.ref }}-${{ inputs.force && 'run-ci' || 'direct' }}
  cancel-in-progress: true

jobs:
  check:
    if: |
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Check code quality
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}
      - name: Unlock keyring (for cli-go keyring tests)
        uses: t1m0thyj/unlock-keyring@cbcf205c879ebd86add70bab3a6abfcce59a5cae # v1.2.0

      - name: Check code quality
        run: pnpm run check:all

      # Advisory only (base-vs-head diff, no acceptance artifact to gate a
      # required check on) — the hard release-time gate is
      # tools/config-release-gate.ts in release-config.yml (CLI-2233).
      # `continue-on-error` flags the diff without failing the job;
      # the tool's own fetch/unshallow fallback resolves a merge-base from
      # this checkout's shallow clone, and skips the compare (exit 0) rather
      # than failing when history still can't be resolved.
      - name: config type-surface diff (advisory)
        continue-on-error: true
        run: pnpm run check:config-api

  test-unit:
    if: |
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Run unit tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Run unit tests
        run: pnpm run test:unit --coverage.enabled

  test-integration:
    if: |
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Run integration tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Run integration tests
        run: pnpm run test:integration --coverage.enabled

  test-stack-ports:
    if: |
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Run stack port tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-8vcpu-ubuntu-2404, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Run stack integration tests
        working-directory: packages/stack
        run: >-
          pnpm test:integration
          src/Ports.integration.test.ts
          src/State.integration.test.ts
          src/State.process.integration.test.ts
          src/HostProcess.integration.test.ts
          src/Network.integration.test.ts
          src/Proxy.integration.test.ts
          src/HttpProxy.integration.test.ts
          --passWithNoTests=false

  test-summary:
    if: |
      always() &&
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Run unit and integration tests
    needs: [test-unit, test-integration, test-stack-ports]
    runs-on: ubuntu-latest
    steps:
      - name: Verify unit and integration tests succeeded
        run: |
          if [ "${{ needs.test-unit.result }}" = "failure" ] || [ "${{ needs.test-unit.result }}" = "cancelled" ] || \
            [ "${{ needs.test-integration.result }}" = "failure" ] || [ "${{ needs.test-integration.result }}" = "cancelled" ]; then
            echo "::error ::Unit or integration tests failed: unit=${{ needs.test-unit.result }}, integration=${{ needs.test-integration.result }}, stack-ports=${{ needs.test-stack-ports.result }}"
            exit 1
          fi
          if [ "${{ needs.test-stack-ports.result }}" = "failure" ] || [ "${{ needs.test-stack-ports.result }}" = "cancelled" ]; then
            echo "::error ::Stack port tests failed: stack-ports=${{ needs.test-stack-ports.result }}"
            exit 1
          fi
          echo "Unit and integration tests reported: unit=${{ needs.test-unit.result }}, integration=${{ needs.test-integration.result }}, stack-ports=${{ needs.test-stack-ports.result }}"

  test-e2e:
    if: |
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Run CLI end-to-end tests (shard ${{ matrix.shard }}/3)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.0.0-beta
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Cache Go CLI binary
        id: cache-go-binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/cli-go/supabase-go
          key: go-cli-${{ runner.os }}-${{ hashFiles('apps/cli-go/**/*.go',
            'apps/cli-go/go.mod', 'apps/cli-go/go.sum') }}

      - name: Build Go CLI
        if: steps.cache-go-binary.outputs.cache-hit != 'true'
        run: go build -o supabase-go .
        working-directory: apps/cli-go

      # The e2e harness invokes `node apps/cli/dist/supabase.js` with
      # `SUPABASE_CLI_BINARY_OVERRIDE` pointing at the compiled binary in
      # `apps/cli/dist/`. Build the CLI explicitly before invoking every
      # package-local e2e suite.
      - name: Build CLI
        run: pnpm exec turbo run supabase#build

      - name: Run end-to-end tests
        run: pnpm exec turbo run test:e2e:run --only --concurrency=1 --filter=supabase --filter=@supabase/cli-e2e -- --shard=${{ matrix.shard }}/3
        env:
          SUPABASE_GO_BINARY: ${{ github.workspace }}/apps/cli-go/supabase-go

  test-stack-e2e:
    if: |
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Run stack end-to-end tests (${{ matrix.runtime }})
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        runtime: [native, docker]
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.0.0-beta

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Run stack end-to-end tests
        run: >-
          pnpm --filter @supabase/stack test:e2e:run
          src/whole-stack.${{ matrix.runtime }}.e2e.test.ts
          --passWithNoTests=false

      - name: Run public stack end-to-end tests
        if: matrix.runtime == 'native'
        run: >-
          pnpm --filter @supabase/stack test:e2e:run
          src/public.e2e.test.ts
          --passWithNoTests=false

  # TEMPORARY: repeat the complete offline E2E and capture an Edge Runtime crash if available.
  reproduce-kong-offline-e2e:
    if: |
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Reproduce offline E2E with crash capture (50 runs)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.0.0-beta
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Configure temporary Edge Runtime crash capture
        shell: bash
        run: |
          set -uo pipefail
          diagnostic_dir="${RUNNER_TEMP}/edge-runtime-kong-offline-repro"
          crash_dir="${diagnostic_dir}/crashes"
          mkdir -p "${crash_dir}"
          chmod 777 "${crash_dir}"
          pattern='/edge-runtime-crashes/core.%e.%P.%t'
          pattern_log="${diagnostic_dir}/core-pattern.log"
          if sudo -n sysctl -w "kernel.core_pattern=${pattern}" >"${pattern_log}" 2>&1; then
            echo "[DEBUG-edge-runtime] configured kernel.core_pattern=${pattern}" | tee -a "${pattern_log}"
          else
            status=$?
            echo "[DEBUG-edge-runtime] kernel.core_pattern configuration failed exit=${status}" | tee -a "${pattern_log}"
          fi
          echo "EDGE_RUNTIME_CRASH_DIR=${crash_dir}" >>"${GITHUB_ENV}"

      - name: Repeat Kong offline E2E
        working-directory: apps/cli
        shell: bash
        run: |
          set -uo pipefail
          diagnostic_dir="${RUNNER_TEMP}/edge-runtime-kong-offline-repro"
          mkdir -p "${diagnostic_dir}"
          failures=0
          completed=0
          core_detected=0

          collect_diagnostics() {
            local label="$1"
            local file="${diagnostic_dir}/${label}.diagnostics.log"
            {
              echo "[DEBUG-edge-runtime] label=${label} timestamp=$(date --iso-8601=seconds)"
              echo "[DEBUG-edge-runtime] docker ps -a --no-trunc"
              docker ps -a --no-trunc --format '{{json .}}' || echo "[DEBUG-edge-runtime] docker ps failed"
              echo "[DEBUG-edge-runtime] docker network ls"
              docker network ls --no-trunc || echo "[DEBUG-edge-runtime] docker network ls failed"
              echo "[DEBUG-edge-runtime] docker image ls --digests"
              docker image ls --digests || echo "[DEBUG-edge-runtime] docker image ls failed"
              echo "[DEBUG-edge-runtime] dmesg tail"
              if dmesg_output="$(sudo -n dmesg 2>&1)"; then
                dmesg_status=0
              elif dmesg_output="$(dmesg 2>&1)"; then
                dmesg_status=0
              else
                dmesg_status=$?
              fi
              printf '%s\n' "${dmesg_output}" | tail -n 200
              echo "[DEBUG-edge-runtime] dmesg exit=${dmesg_status}"
            } >"${file}" 2>&1
          }

          for iteration in $(seq 1 50); do
            log="${diagnostic_dir}/iteration-${iteration}.log"
            collect_diagnostics "iteration-${iteration}-before"
            echo "[DEBUG-edge-runtime] starting iteration=${iteration}" | tee "${log}"
            if pnpm run test:e2e:run src/shared/functions/serve-main-offline.e2e.test.ts --reporter=verbose >>"${log}" 2>&1; then
              status=0
            else
              status=$?
            fi
            completed=$((completed + 1))
            echo "[DEBUG-edge-runtime] iteration=${iteration} exit=${status}" | tee -a "${log}"
            collect_diagnostics "iteration-${iteration}-after"
            if [ "${status}" -ne 0 ]; then
              failures=$((failures + 1))
              echo "[DEBUG-edge-runtime] iteration=${iteration} failed; preserving log tail"
              tail -n 160 "${log}"
            fi
            core_count=$(find "${diagnostic_dir}/crashes" -maxdepth 1 -type f -name 'core.*' | wc -l | tr -d ' ')
            if [ "${core_count}" -gt 0 ]; then
              core_detected=1
              echo "[DEBUG-edge-runtime] core captured after iteration=${iteration}; stopping repetition"
              break
            fi
          done

          core_count=$(find "${diagnostic_dir}/crashes" -maxdepth 1 -type f -name 'core.*' | wc -l | tr -d ' ')
          printf '[DEBUG-edge-runtime] planned=50 completed=%s failures=%s cores=%s\n' "${completed}" "${failures}" "${core_count}" | tee "${diagnostic_dir}/summary.log"
          if [ "${failures}" -ne 0 ] || [ "${core_detected}" -ne 0 ]; then
            exit 1
          fi

      - name: Analyze Edge Runtime core dumps
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          crash_dir="${RUNNER_TEMP}/edge-runtime-kong-offline-repro/crashes"
          mapfile -t cores < <(find "${crash_dir}" -maxdepth 1 -type f -name 'core.*' -print 2>/dev/null)
          if [ "${#cores[@]}" -eq 0 ]; then
            echo "[DEBUG-edge-runtime] no core dumps found"
            exit 0
          fi
          for core in "${cores[@]}"; do
            if sudo -n chmod a+r "${core}"; then
              echo "[DEBUG-edge-runtime] made core readable=${core}"
            else
              echo "[DEBUG-edge-runtime] could not make core readable=${core}"
            fi
          done
          if ! command -v gdb >/dev/null 2>&1; then
            echo "[DEBUG-edge-runtime] gdb missing; installing because core dumps exist"
            if ! sudo -n apt-get update || ! sudo -n apt-get install -y gdb; then
              echo "[DEBUG-edge-runtime] gdb installation failed"
              exit 0
            fi
          fi
          binary="${crash_dir}/edge-runtime"
          debug="${crash_dir}/edge-runtime.debug"
          if [ ! -f "${binary}" ] || [ ! -f "${debug}" ]; then
            echo "[DEBUG-edge-runtime] matching runtime binary/debug symbols unavailable"
            exit 0
          fi
          for core in "${cores[@]}"; do
            report="${core}.gdb.log"
            for artifact in "${binary}" "${debug}"; do
              if sudo -n chmod a+r "${artifact}"; then
                echo "[DEBUG-edge-runtime] made artifact readable=${artifact}"
              else
                echo "[DEBUG-edge-runtime] could not make artifact readable=${artifact}"
              fi
            done
            echo "[DEBUG-edge-runtime] analyzing core=${core} binary=${binary} debug=${debug}"
            gdb -batch -q "${binary}" "${core}" \
              -ex "set pagination off" \
              -ex 'p $_siginfo' \
              -ex 'info proc mappings' \
              -ex 'thread apply all bt' \
              >"${report}" 2>&1 || echo "[DEBUG-edge-runtime] gdb failed for ${core}" >>"${report}"
          done

      - name: Upload Kong offline reproduction diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-runtime-kong-offline-repro-${{ github.run_id }}
          path: ${{ runner.temp }}/edge-runtime-kong-offline-repro
          if-no-files-found: error
          retention-days: 7

  # Summary job that gates branch protection. It preserves the original check
  # name and succeeds iff every CLI shard and stack runtime succeeded.
  test-e2e-summary:
    if: |
      always() &&
      !startsWith(github.head_ref, 'release-notes/') &&
      (github.event_name == 'merge_group' ||
        inputs.force ||
        github.event.pull_request.draft == false)
    name: Run end-to-end tests
    needs: [test-e2e, test-stack-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all shards succeeded
        run: |
          if [ "${{ needs.test-e2e.result }}" = "failure" ] || [ "${{ needs.test-e2e.result }}" = "cancelled" ] || [ "${{ needs.test-stack-e2e.result }}" = "failure" ] || [ "${{ needs.test-stack-e2e.result }}" = "cancelled" ]; then
            echo "::error ::One or more e2e jobs failed: cli=${{ needs.test-e2e.result }}, stack=${{ needs.test-stack-e2e.result }}"
            exit 1
          fi
          echo "All e2e jobs reported: cli=${{ needs.test-e2e.result }}, stack=${{ needs.test-stack-e2e.result }}"
