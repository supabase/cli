name: TEMP Verify Install Channels (PR validation)

# TEMPORARY — DELETE BEFORE MERGE.
#
# Validates .github/workflows/verify-install-channels.yml on this PR before it
# lands on develop. `workflow_dispatch` cannot target a non-default branch, so
# the new reusable workflow can't be run by hand from this branch; this caller
# runs on `pull_request` instead and exercises every leg against an already
# published stable release (v2.107.0 — the release whose brew/scoop checksums
# this PR exists to guard, since corrected by homebrew-tap#820 / scoop-bucket#819).
#
# Once the run is green, this file is removed in the same PR.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/verify-install-channels.yml
    with:
      version: "2.107.0"
      brew_name: supabase
      scoop_name: supabase
