name: Release Smoke Test

on:
  pull_request:
    branches:
      - main
      # TODO(CLI-2442): spike 2 only. Remove `develop` before merging.
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and smoke test
        required: false
        type: string
        default: 0.0.0-smoke
      npm_tag:
        description: npm tag to use for local package smoke tests
        required: false
        type: choice
        options:
          - latest
          - alpha
          - beta
        default: beta

permissions:
  # release-shared.yml declares privileged publish jobs. They are gated by
  # dry_run here, but GitHub validates nested-workflow permissions at startup.
  actions: read
  contents: write
  id-token: write
  pull-requests: write

jobs:
  smoke:
    name: Run release smoke tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'hotfix/')
    uses: ./.github/workflows/release-shared.yml
    with:
      version: ${{ inputs.version || '0.0.0-smoke' }}
      npm_tag: ${{ inputs.npm_tag || 'beta' }}
      channel: beta
      prerelease: true
      dry_run: true
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      DF_FIREWALL_TOKEN: ${{ secrets.DF_FIREWALL_TOKEN }}
