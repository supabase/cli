name: Benchmark CLI

on:
  push:
    branches:
      - bench/cli-workflows-2026-09-24
    paths:
      - .github/workflows/benchmark-cli.yml
      - scripts/benchmarks/**
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable CLI source commit to benchmark
        required: true
        type: string
        default: f31fde455d1509fdad9518de0c263d15c676609e
      legacy_version:
        description: Published CLI version used for the legacy baseline
        required: true
        type: string
        default: 2.117.0
      samples:
        description: Independent samples per supported case
        required: true
        type: choice
        options:
          - "1"
          - "3"
          - "5"
        default: "5"

permissions:
  contents: read

concurrency:
  group: cli-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: macos-arm64
            runner: macos-15
    steps:
      - name: Check out benchmark source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || 'f31fde455d1509fdad9518de0c263d15c676609e' }}
          persist-credentials: false
          submodules: false

      - name: Set up toolchains and dependencies
        uses: ./.github/actions/setup
        with:
          dependency-cache: "false"

      - name: Build standalone CLI
        run: pnpm exec turbo run supabase#build

      - name: Record build runner metadata
        env:
          BENCHMARK_PLATFORM: ${{ matrix.platform }}
          BENCHMARK_RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path

          binary = Path("apps/cli/dist/supabase")
          binary.chmod(0o755)
          cpu = platform.processor() or "unknown"
          if platform.system() == "Linux":
              for line in Path("/proc/cpuinfo").read_text().splitlines():
                  if line.lower().startswith("model name"):
                      cpu = line.split(":", 1)[1].strip()
                      break
          elif platform.system() == "Darwin":
              cpu = subprocess.run(["sysctl", "-n", "machdep.cpu.brand_string"], text=True, capture_output=True).stdout.strip() or cpu
          memory = subprocess.run(["sysctl", "-n", "hw.memsize"], text=True, capture_output=True).stdout.strip() if platform.system() == "Darwin" else str(os.sysconf("SC_PAGE_SIZE") * os.sysconf("SC_PHYS_PAGES"))
          metadata = {
              "platform": os.environ["BENCHMARK_PLATFORM"],
              "runner_label": os.environ["BENCHMARK_RUNNER_LABEL"],
              "image_os": os.environ.get("ImageOS", "unknown"),
              "image_version": os.environ.get("ImageVersion", "unknown"),
              "source_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "cli_version": subprocess.check_output([str(binary), "--version"], text=True).strip(),
              "architecture": platform.machine(),
              "cpu_model": cpu,
              "cpu_count": os.cpu_count(),
              "memory_bytes": int(memory),
              "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
          }
          Path("benchmark-runner.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY

      - name: Package compiled CLI
        run: |
          mkdir -p "$RUNNER_TEMP/compiled-cli-artifact"
          tar -czf "$RUNNER_TEMP/compiled-cli-artifact/compiled-cli.tar.gz" -C apps/cli/dist supabase supabase-go
          cp benchmark-runner.json "$RUNNER_TEMP/compiled-cli-artifact/"

      - name: Upload compiled CLI and metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-cli-${{ matrix.platform }}
          path: ${{ runner.temp }}/compiled-cli-artifact/*
          if-no-files-found: error
          retention-days: 14

  measure:
    name: ${{ matrix.platform }} · ${{ matrix.case }} · sample ${{ matrix.sample }}
    needs: build
    runs-on: ${{ matrix.platform == 'linux-x64' && 'ubuntu-22.04' || 'macos-15' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        platform:
          - linux-x64
          - macos-arm64
        case:
          - stack-new-native-default
          - stack-new-native-eager
          - stack-new-docker-default
          - stack-new-docker-eager
          - stack-legacy-docker-default
          - stack-legacy-docker-eager
          - schema-new-native
          - schema-new-docker
          - schema-legacy-docker
        sample: ${{ fromJSON(github.event_name == 'push' && '[1]' || inputs.samples == '1' && '[1]' || inputs.samples == '3' && '[1,2,3]' || '[1,2,3,4,5]') }}
        exclude:
          - platform: macos-arm64
            case: stack-new-docker-default
          - platform: macos-arm64
            case: stack-new-docker-eager
          - platform: macos-arm64
            case: stack-legacy-docker-default
          - platform: macos-arm64
            case: stack-legacy-docker-eager
          - platform: macos-arm64
            case: schema-new-docker
          - platform: macos-arm64
            case: schema-legacy-docker
    steps:
      - name: Check out benchmark scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Download compiled CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-cli-${{ matrix.platform }}
          path: ${{ runner.temp }}/compiled-cli

      - name: Install CLI binary and record runner metadata
        env:
          BENCHMARK_PLATFORM: ${{ matrix.platform }}
          BENCHMARK_RUNNER_LABEL: ${{ matrix.platform == 'linux-x64' && 'ubuntu-22.04' || 'macos-15' }}
          BENCHMARK_CASE: ${{ matrix.case }}
          BENCHMARK_SAMPLE: ${{ matrix.sample }}
          LEGACY_VERSION: ${{ inputs.legacy_version || '2.117.0' }}
        run: |
          mkdir -p "$RUNNER_TEMP/benchmark-bin" "benchmark-results"
          tar -xzf "$RUNNER_TEMP/compiled-cli/compiled-cli.tar.gz" -C "$RUNNER_TEMP/benchmark-bin"
          chmod +x "$RUNNER_TEMP/benchmark-bin/supabase"
          cp "$RUNNER_TEMP/compiled-cli/benchmark-runner.json" benchmark-results/build-runner.json
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path

          cpu = platform.processor() or "unknown"
          if platform.system() == "Linux":
              for line in Path("/proc/cpuinfo").read_text().splitlines():
                  if line.lower().startswith("model name"):
                      cpu = line.split(":", 1)[1].strip()
                      break
          elif platform.system() == "Darwin":
              cpu = subprocess.run(["sysctl", "-n", "machdep.cpu.brand_string"], text=True, capture_output=True).stdout.strip() or cpu
          memory = subprocess.run(["sysctl", "-n", "hw.memsize"], text=True, capture_output=True).stdout.strip() if platform.system() == "Darwin" else str(os.sysconf("SC_PAGE_SIZE") * os.sysconf("SC_PHYS_PAGES"))
          metadata = {
              "platform": os.environ["BENCHMARK_PLATFORM"],
              "case": os.environ["BENCHMARK_CASE"],
              "sample": int(os.environ["BENCHMARK_SAMPLE"]),
              "runner_label": os.environ["BENCHMARK_RUNNER_LABEL"],
              "legacy_cli_version": os.environ["LEGACY_VERSION"],
              "image_os": os.environ.get("ImageOS", "unknown"),
              "image_version": os.environ.get("ImageVersion", "unknown"),
              "architecture": platform.machine(),
              "cpu_model": cpu,
              "cpu_count": os.cpu_count(),
              "memory_bytes": int(memory),
          }
          Path("benchmark-results/runner.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY

      - name: Set an unavailable Docker endpoint for native run
        if: contains(matrix.case, 'native')
        run: |
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            sudo systemctl stop docker.service docker.socket
            if docker --host unix:///tmp/benchmark-no-docker.sock info >/dev/null 2>&1; then
              echo "Docker unexpectedly responded on the unavailable benchmark endpoint" >&2
              exit 1
            fi
          fi
          echo "DOCKER_HOST=unix:///tmp/benchmark-no-docker.sock" >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install PostgreSQL client
        if: matrix.platform == 'macos-arm64'
        run: |
          brew install libpq
          echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"

      - name: Install pinned legacy CLI
        if: contains(matrix.case, 'legacy')
        env:
          LEGACY_VERSION: ${{ inputs.legacy_version || '2.117.0' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/legacy-cli" --no-save "supabase@$LEGACY_VERSION"
          "$RUNNER_TEMP/legacy-cli/node_modules/.bin/supabase" --version

      - name: Capture case
        env:
          BENCHMARK_CASE: ${{ matrix.case }}
          BENCHMARK_SAMPLE: ${{ matrix.sample }}
          BENCHMARK_PLATFORM: ${{ matrix.platform }}
          COMPILED_CLI: ${{ runner.temp }}/benchmark-bin/supabase
          LEGACY_CLI: ${{ runner.temp }}/legacy-cli/node_modules/.bin/supabase
        run: |
          set -o pipefail
          case "$BENCHMARK_CASE" in
            stack-*)
              IFS=- read -r _ implementation runtime mode <<< "$BENCHMARK_CASE"
              cli="$COMPILED_CLI"
              if [ "$implementation" = legacy ]; then cli="$LEGACY_CLI"; fi
              python3 scripts/benchmarks/stack.py \
                --cli "$cli" \
                --implementation "$implementation" \
                --runtime "$runtime" \
                --mode "$mode" \
                --sample "$BENCHMARK_SAMPLE" \
                --output "benchmark-results"
              ;;
            schema-*)
              IFS=- read -r _ implementation runtime <<< "$BENCHMARK_CASE"
              cli="$COMPILED_CLI"
              if [ "$implementation" = legacy ]; then cli="$LEGACY_CLI"; fi
              python3 scripts/benchmarks/schema.py \
                --cli "$cli" \
                --implementation "$implementation" \
                --runtime "$runtime" \
                --sample "$BENCHMARK_SAMPLE" \
                --output "benchmark-results"
              ;;
          esac

      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-${{ matrix.platform }}-${{ matrix.case }}-sample-${{ matrix.sample }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
