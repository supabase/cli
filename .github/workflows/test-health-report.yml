name: Weekly test-suite health report

# Advisory only — the report script never fails the job for what it finds, only for a tool
# failure, and this workflow gates nothing.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: test-health-report
  cancel-in-progress: false

jobs:
  report:
    name: Build report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The report diffs test LOC between HEAD and the last commit at least a week old.
          fetch-depth: 0

      # Bun and git/gh (preinstalled on the runner) only — no workspace install needed.
      - name: Install toolchains
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.0

      - name: Build report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun .github/scripts/test-health-report/report.ts
