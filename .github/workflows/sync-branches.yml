name: Sync branches

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      pair:
        description: Source and target branch to sync
        required: true
        type: choice
        default: main-into-develop
        options:
          - main-into-develop
          - develop-into-next

permissions:
  contents: read

concurrency:
  group: sync-${{ github.event_name == 'push' && 'develop-into-next' || github.event_name == 'workflow_run' && 'main-into-develop' || inputs.pair }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ${{ github.event_name == 'push' && 'develop-into-next' || github.event_name == 'workflow_run' && 'main-into-develop' || inputs.pair }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PAIR: ${{ github.event_name == 'push' && 'develop-into-next' || github.event_name == 'workflow_run' && 'main-into-develop' || inputs.pair }}
    outputs:
      conflict_pr: ${{ steps.sync.outputs.conflict_pr }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - id: sync
        name: Sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun .github/scripts/sync-branches.ts "$PAIR"

  # A main-into-develop conflict blocks the next production deploy, so the
  # people who just shipped the hotfix hear about it where the release landed.
  notify-conflict:
    name: Announce back-merge conflict
    needs: sync
    if: |
      needs.sync.outputs.conflict_pr != '' &&
      (github.event_name == 'push' && 'develop-into-next' || github.event_name == 'workflow_run' && 'main-into-develop' || inputs.pair) == 'main-into-develop'
    uses: ./.github/workflows/slack-notify.yml
    with:
      package: Supabase CLI
      status: sync-conflict
      pull_request: ${{ needs.sync.outputs.conflict_pr }}
    secrets:
      SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}

  # Claude resolves with file tools only, then the job runs the merged tree's quick checks and lets Claude fix them once.
  # That code is reviewed `develop` and `next` code plus Claude's edits, so this job holds no GitHub write token; the
  # publish job pushes the result from a fresh checkout. See
  # apps/cli/docs/release-process.md#claude-resolved-develop-into-next.
  resolve:
    name: Resolve conflicts with Claude
    needs: sync
    if: |
      needs.sync.outputs.conflict_pr != '' &&
      (github.event_name == 'push' && 'develop-into-next' || github.event_name == 'workflow_run' && 'main-into-develop' || inputs.pair) == 'develop-into-next'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # Covers the resolve call, one quick check run, and one fix call.
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      resolved: ${{ steps.resolve.outputs.resolved }}
    env:
      CLAUDE_MODEL: claude-opus-5-5
      OUTPUT_DIR: ${{ github.workspace }}/sync-agent
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: work
          ref: sync/develop-into-next
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: trusted/.bun-version

      # Installs mise only; the script installs the merged tree's own toolchain after the merge.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.0
          install: false
          working_directory: work

      # Same pinned release and isolated npm config as the AI review workflow.
      - name: Install Claude Code CLI
        run: |
          npm install -g \
            --userconfig "${RUNNER_TEMP}/sync-npmrc-user" \
            --globalconfig "${RUNNER_TEMP}/sync-npmrc-global" \
            --registry=https://registry.npmjs.org/ @anthropic-ai/claude-code@2.1.280

      - name: Resolve
        id: resolve
        working-directory: trusted
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORK_DIR: ${{ github.workspace }}/work
        run: |
          git -C "$WORK_DIR" config user.name "github-actions[bot]"
          git -C "$WORK_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun .github/scripts/sync-agent.ts resolve

      - name: Bundle the resolution
        if: steps.resolve.outputs.resolved == 'true'
        run: git -C work bundle create "$OUTPUT_DIR/sync.bundle" HEAD --not origin/sync/develop-into-next origin/next

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: sync-resolution
          path: |
            ${{ github.workspace }}/sync-agent/comment.md
            ${{ github.workspace }}/sync-agent/sync.bundle
          if-no-files-found: ignore
          retention-days: 7

  # Runs after a failed resolve too, so the pull request always says what happened.
  publish:
    name: Publish the resolution
    needs:
      - sync
      - resolve
    if: ${{ !cancelled() && needs.sync.outputs.conflict_pr != '' && needs.resolve.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The AI review skips bot pull requests, so the job's own token dispatches it (`actions: write`).
    permissions:
      contents: read
      actions: write
    env:
      OUTPUT_DIR: ${{ github.workspace }}/sync-agent
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: sync-resolution
          path: ${{ github.workspace }}/sync-agent

      # A plain push fails if the sync branch moved since the resolve job checked it out.
      - name: Publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          JOB_TOKEN: ${{ github.token }}
          PR: ${{ needs.sync.outputs.conflict_pr }}
          RESOLVED: ${{ needs.resolve.outputs.resolved }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
        run: |
          if [ "$RESOLVED" = true ]; then
            git fetch "$OUTPUT_DIR/sync.bundle" HEAD:refs/sync/resolution
            git -c core.hooksPath=/dev/null push \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/sync/resolution:refs/heads/sync/develop-into-next
          fi
          if [ -f "$OUTPUT_DIR/comment.md" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$OUTPUT_DIR/comment.md"
          elif [ "$RESOLVE_RESULT" != success ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
              --body "@supabase/cli The resolve job failed; resolve this merge by hand as described above ([workflow run](${RUN_URL}))."
          fi
          if [ "$RESOLVED" = true ]; then
            GH_TOKEN="$JOB_TOKEN" gh workflow run ai-review.yml --repo "$GITHUB_REPOSITORY" -f pr="$PR"
          fi
