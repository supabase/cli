name: Coverage

# Coverage left the PR jobs (ADR 0024): nothing gated on it and instrumentation
# taxed every run. This workflow produces one merged report for unit and
# integration tests across every package on each develop push and keeps it as
# an artifact.
on:
  push:
    branches:
      - develop
    paths-ignore:
      - "apps/docs/**"
      - "apps/cli-go/**"
      - "release-notes/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Merged unit and integration coverage
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Run unit and integration tests with coverage
        run: pnpm run test --coverage.enabled

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30
