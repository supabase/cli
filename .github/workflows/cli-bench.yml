name: CLI benchmark
run-name: "CLI benchmark #${{ github.event.pull_request.number || github.event.issue.number }}"

# Report-only comparison of a pull request's CLI build with a build of its merge base. Every
# workload runs against the replay server, so no Docker, database, or network is involved. The
# job never blocks a pull request and is not a required check.
#
# Each run writes a job summary. The first run on a pull request from this repository also posts
# one comment tagged `<!-- cli-bench:pr -->`; later pushes leave it alone. A maintainer commenting
# exactly `/bench` re-runs the benchmark on the pull request's current head and updates that
# comment. See apps/cli/docs/tracing-monitoring.md.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - develop
      - next
    paths:
      - "apps/cli/**"
      - "apps/cli-e2e/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/cli-bench.yml"
      - ".github/actions/cli-bench-run/**"
      - ".github/scripts/cli-bench/**"
  # A `/bench` comment on a pull request starts a run. The resolve job checks who commented and
  # which commit it applies to; the jobs that run pull request code hold no write permission, and
  # the one job that writes comments never checks out or runs pull request code.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types:
      - created

permissions: {}

# Comments that are not a `/bench` from a maintainer get a per-run group, so they cannot cancel an
# in-flight benchmark; `/bench full` is one of them.
concurrency:
  group: >-
    cli-bench-${{ github.event.pull_request.number || github.event.issue.number }}-${{
      (github.event_name == 'issue_comment' && (github.event.comment.body != '/bench' ||
        !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
        && github.run_id || 'run' }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve
    # Cheap, non-authoritative pre-filter; resolve.ts does the exact command match and the
    # effective-permission lookup.
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/bench') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reacts to the accepted command; runs only code from the default branch.
    permissions:
      contents: read
      pull-requests: write
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      # Every job benchmarks this commit, so a push during the run is never reported as measured.
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      is_fork: ${{ steps.resolve.outputs.is_fork }}
      trigger: ${{ steps.resolve.outputs.trigger }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
          no-cache: true
      - name: Resolve
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: bun .github/scripts/cli-bench/resolve.ts

  # Two jobs, chosen by trigger, so the job that runs a `/bench` head never references a secret:
  # secrets referenced anywhere in a job are sent to its runner.
  bench-pr:
    name: Benchmark CLI against merge base
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true' && needs.resolve.outputs.trigger == 'auto'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # GitHub withholds secrets from fork pull requests, so the token is empty for them.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Benchmark
        uses: ./.github/actions/cli-bench-run
        with:
          head-sha: ${{ needs.resolve.outputs.head_sha }}
          base-ref: ${{ needs.resolve.outputs.base_ref }}

  # Runs in the default branch's context, so it takes no secrets and writes no cache: the toolchain
  # comes from `mise-action` with its cache off, and dependencies install from the public registry
  # with no store cache.
  bench-command:
    name: Benchmark CLI against merge base (command)
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true' && needs.resolve.outputs.trigger == 'command'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install toolchains
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          cache: false

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile

      - name: Benchmark
        uses: ./.github/actions/cli-bench-run
        with:
          head-sha: ${{ needs.resolve.outputs.head_sha }}
          base-ref: ${{ needs.resolve.outputs.base_ref }}

  comment:
    name: Post pull request comment
    needs:
      - resolve
      - bench-pr
      - bench-command
    # A pull_request run from a fork has a read-only token, so only `/bench` comments a fork's
    # result. Failing to post never fails the workflow.
    if: >-
      ${{ !cancelled() && needs.resolve.outputs.should_run == 'true' && (needs.bench-pr.result == 'success' || needs.bench-command.result == 'success') &&
      (needs.resolve.outputs.trigger == 'command' || needs.resolve.outputs.is_fork == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    # The only job that can write to the pull request. It runs scripts from the default branch and
    # reads the rendered markdown as data; it never checks out or runs pull request code.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
          no-cache: true
      - name: Download comment
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-bench-comment
          path: ${{ runner.temp }}/bench-comment
      - name: Post comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          MODE: ${{ needs.resolve.outputs.trigger == 'command' && 'upsert' || 'create-if-missing' }}
          BODY_FILE: ${{ runner.temp }}/bench-comment/comment.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f "$BODY_FILE" ]; then
            echo "The benchmark job produced no comment."
            exit 0
          fi
          bun .github/scripts/cli-bench/post-comment.ts
