name: CLI benchmark

# Report-only comparison of the pull request's CLI build with a build of its merge base. Every
# workload runs against the replay server, so no Docker, database, or network is involved. The
# job never blocks a pull request and is not a required check.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - develop
      - next
    paths:
      - "apps/cli/**"
      - "apps/cli-e2e/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/cli-bench.yml"

permissions:
  contents: read

concurrency:
  group: cli-bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bench:
    if: github.event.pull_request.draft == false
    name: Benchmark CLI against merge base
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Prepare benchmark directory
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          echo "BENCH_DIR=$RUNNER_TEMP/bench" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Build branch binary
        id: branch_build
        run: |
          pnpm --filter supabase run build:binary
          mkdir -p "$BENCH_DIR/branch"
          cp apps/cli/dist/supabase "$BENCH_DIR/branch/supabase"

      - name: Build merge-base binary
        id: base_build
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          merge_base="$(git merge-base HEAD "origin/$BASE_REF")"
          echo "Merge base: $merge_base"
          git worktree add "$RUNNER_TEMP/base-src" "$merge_base"
          cd "$RUNNER_TEMP/base-src"
          pnpm install --frozen-lockfile
          pnpm --filter supabase run build:binary
          mkdir -p "$BENCH_DIR/base"
          cp apps/cli/dist/supabase "$BENCH_DIR/base/supabase"

      - name: Start replay server
        id: replay
        if: steps.base_build.outcome == 'success'
        run: |
          bun apps/cli-e2e/scripts/replay-serve.ts > "$BENCH_DIR/replay.log" 2>&1 &
          echo "REPLAY_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            url="$(grep -o 'http://[^"]*' "$BENCH_DIR/replay.log" | head -n 1 || true)"
            if [ -n "$url" ]; then
              echo "REPLAY_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.5
          done
          echo "replay server did not report a URL" >&2
          cat "$BENCH_DIR/replay.log" >&2
          exit 1

      - name: Run benchmark
        id: bench
        if: steps.base_build.outcome == 'success'
        shell: bash
        run: |
          bun apps/cli/scripts/bench-cli.ts \
            --base "$BENCH_DIR/base/supabase" \
            --branch "$BENCH_DIR/branch/supabase" \
            --workloads apps/cli/bench/workloads.pr.json \
            --api-url "$REPLAY_URL" \
            --trace \
            --out "$BENCH_DIR/report.json" | tee "$BENCH_DIR/report.txt"

      - name: Stop replay server
        if: always() && env.REPLAY_PID != ''
        run: kill "$REPLAY_PID" || true

      - name: Write job summary
        if: always() && steps.branch_build.outcome == 'success'
        env:
          BASE_BUILD: ${{ steps.base_build.outcome == 'success' && 'ok' || 'failed' }}
        run: bun apps/cli/scripts/bench-summary.ts --report "$BENCH_DIR/report.json" --base-build "$BASE_BUILD"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-bench-report
          path: |
            ${{ runner.temp }}/bench/report.json
            ${{ runner.temp }}/bench/report.txt
          retention-days: 14
          if-no-files-found: ignore
