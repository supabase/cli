name: IPv6 Probe (temporary)

# TEMPORARY diagnostic to characterize IPv6 egress on the Blacksmith runner and
# Docker containers, to decide whether the live DB tests can connect directly
# (IPv6-only host) or must use the IPv4 transaction pooler. Remove once answered.
on:
  pull_request:
    paths:
      - ".github/workflows/ipv6-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: IPv6 probe
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Host — interfaces & routes
        run: |
          set +e
          echo "::group::ip -6 addr"; ip -6 addr show 2>&1 || true; echo "::endgroup::"
          echo "::group::ip -6 route"; ip -6 route show 2>&1 || true; echo "::endgroup::"
          echo "default v6 route present: $(ip -6 route show default 2>/dev/null | grep -c default)"

      - name: Host — public IPv6 egress
        run: |
          set +e
          echo "-- curl -4 sanity (github) --"
          curl -4 -sS -m 10 https://api.github.com -o /dev/null -w "HOST curl -4 github: http=%{http_code}\n"; echo "  exit=$?"
          echo "-- curl -6 one.one.one.one --"
          curl -6 -sS -m 12 https://one.one.one.one -o /dev/null -w "HOST curl -6 cloudflare: http=%{http_code}\n"; echo "  exit=$?"
          echo "-- curl -6 ipv6.google.com --"
          curl -6 -sS -m 12 https://ipv6.google.com -o /dev/null -w "HOST curl -6 google: http=%{http_code}\n"; echo "  exit=$?"
          echo "VERDICT host-egress: a non-zero exit on BOTH curl -6 above means NO public IPv6 egress."

      - name: Docker — default daemon container IPv6
        run: |
          set +e
          docker version --format 'docker server {{.Server.Version}}' 2>&1
          echo "-- container curl -6 (default daemon) --"
          docker run --rm alpine sh -c 'apk add --no-cache curl >/dev/null 2>&1; curl -6 -sS -m 12 https://one.one.one.one -o /dev/null -w "CONTAINER curl -6 default: http=%{http_code}\n" || echo "CONTAINER curl -6 default: FAILED exit=$?"'
          echo "  step exit=$?"

      - name: Docker — daemon IPv6 enabled
        run: |
          set +e
          echo '{ "ipv6": true, "fixed-cidr-v6": "fd00:dead:beef::/48", "experimental": true, "ip6tables": true }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker 2>&1 || sudo service docker restart 2>&1 || true
          sleep 6
          docker info 2>/dev/null | grep -iE "ipv6|server version" || true
          echo "-- container curl -6 (ipv6 daemon, default bridge) --"
          docker run --rm alpine sh -c 'apk add --no-cache curl >/dev/null 2>&1; curl -6 -sS -m 12 https://one.one.one.one -o /dev/null -w "CONTAINER curl -6 ipv6-daemon: http=%{http_code}\n" || echo "CONTAINER curl -6 ipv6-daemon: FAILED exit=$?"'
          echo "-- container curl -6 (--ipv6 network) --"
          docker network create --ipv6 --subnet fd00:cafe::/64 v6net 2>&1 || true
          docker run --rm --network v6net alpine sh -c 'apk add --no-cache curl >/dev/null 2>&1; curl -6 -sS -m 12 https://one.one.one.one -o /dev/null -w "CONTAINER curl -6 v6net: http=%{http_code}\n" || echo "CONTAINER curl -6 v6net: FAILED exit=$?"'
          echo "VERDICT docker-ipv6: a CONTAINER http=200 here means Docker IPv6 works (only useful if HOST egress also works)."
