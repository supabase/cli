name: Windows clone flag diagnostics
on:
  push:
    branches: [perf/snapshot-windows-diagnostics]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.0
      - name: Compare copy flag behavior
        shell: pwsh
        run: |
          Get-Volume | Format-Table DriveLetter, FileSystem
          bun --revision
          bun .github/scripts/snapshot-windows-probe.mjs
          node .github/scripts/snapshot-windows-probe.mjs
