rules:
  unpinned-uses: error # actions, reusable workflows and docker:// must be pinned to a full SHA / @sha256 digest
self-hosted-runner:
  labels:
    - arm-runner
    - blacksmith-2vcpu-ubuntu-2404
    - blacksmith-4vcpu-ubuntu-2404
    - blacksmith-6vcpu-macos-latest
    - blacksmith-8vcpu-ubuntu-2404
    - blacksmith-8vcpu-windows-2025
    - blacksmith-32vcpu-ubuntu-2404
paths:
  # Git submodules of other projects; CI never checks them out.
  ".repos/**":
    ignore:
      - ".*"
