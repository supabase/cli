version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"
    commit-message:
      prefix: "chore(ci): "
    groups:
      actions-major:
        patterns:
          - "*"
        exclude-patterns:
          - "openai/codex-action"
    ignore:
      - dependency-name: "supabase/setup-cli"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "openai/codex-action"
        versions:
          - "1.12.x"
        # Deliberately pinned to v1.11 in ai-review.yml — v1.12 has two
        # confirmed, still-open upstream regressions: a wrapper-level hang
        # (openai/codex-action#151) and a runner-killing failure
        # (openai/codex-action#160). A grouped Dependabot bump already
        # silently reintroduced v1.12 once (PR #6484, 2026-09-07). Scoped to
        # 1.12.x (not a blanket ignore) so Dependabot still proposes v1.13+
        # once a fix ships; evaluate any such proposal in its own deliberate
        # PR, checking the upstream changelog/issue tracker first — never
        # bundle it into the actions-major group.
    cooldown:
      default-days: 7
  - package-ecosystem: "gomod"
    directories:
      - "/apps/cli-go"
      - "/apps/cli-go/pkg"
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"
    commit-message:
      prefix: "chore(cli-go): "
    groups:
      go-minor:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - github.com/compose-spec/compose-go/v2
    ignore:
      - dependency-name: "github.com/compose-spec/compose-go/v2"
      - dependency-name: "github.com/docker/cli"
      - dependency-name: "github.com/docker/docker"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"
    commit-message:
      prefix: "fix(misc): "
      prefix-development: "chore(misc): "
    groups:
      npm-major:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/apps/cli-go/pkg/config/templates"
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"
    commit-message:
      prefix: "fix(misc): "
    groups:
      docker-minor:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "library/kong"
      - dependency-name: "axllent/mailpit"
      - dependency-name: "darthsim/imgproxy"
      - dependency-name: "timberio/vector"
    cooldown:
      default-days: 7
      exclude:
        - "supabase/*"
