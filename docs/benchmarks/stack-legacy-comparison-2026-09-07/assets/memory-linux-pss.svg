<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">a clearer view of Linux RAM</title><desc id="desc">Linux stack process PSS in MiB; legacy with pooler compared to new default and eager runtimes.</desc><defs><linearGradient id="greenBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b1f8d2"/><stop offset="0.48" stop-color="#3ecf8e"/><stop offset="1" stop-color="#269b6b"/></linearGradient><linearGradient id="baseBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#65716a"/><stop offset="1" stop-color="#303833"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="16" result="blur"/></filter></defs><rect x="0.0" y="0.0" width="1600.0" height="1000.0" rx="0.0" fill="#0b0d0c" opacity="1.00"/><circle cx="1430" cy="170" r="300" fill="#113e2c" opacity="0.16" filter="url(#glow)"/><text x="92.0" y="78.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="17px" font-weight="700" letter-spacing="2.3px" fill="#3ecf8e" text-anchor="start">UBUNTU 22.04 · PROPORTIONAL SET SIZE</text><text x="92.0" y="176.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="80px" font-weight="900" letter-spacing="0px" fill="#f4f7f4" text-anchor="start">a clearer view of Linux RAM</text><text x="94.0" y="231.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="23px" font-weight="500" letter-spacing="0px" fill="#9ca9a2" text-anchor="start">PSS apportions shared pages between processes. Lower is better.</text><line x1="92.0" y1="274.0" x2="1508.0" y2="274.0" stroke="#26322c" stroke-width="1.0" opacity="1.00"/><line x1="490.0" y1="360.0" x2="490.0" y2="827.0" stroke="#53615a" stroke-width="1.0" opacity="0.40" stroke-dasharray="6 10"/><text x="490.0" y="858.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="16px" font-weight="500" letter-spacing="0px" fill="#9ca9a2" text-anchor="middle">0</text><line x1="665.0" y1="360.0" x2="665.0" y2=