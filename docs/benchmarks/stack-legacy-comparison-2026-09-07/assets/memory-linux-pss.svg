icode MS,sans-serif" font-size="27px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="start">1,925</text><text x="92.0" y="507.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="25px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="start">New Docker · default</text><rect x="490.0" y="473.0" width="73.6" height="49.0" rx="8.0" fill="url(#greenBar)" opacity="1.00"/><text x="581.6" y="507.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="27px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="start">210</text><text x="92.0" y="597.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="25px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="start">New native · default</text><rect x="490.0" y="563.0" width="63.1" height="49.0" rx="8.0" fill="url(#greenBar)" opacity="1.00"/><text x="571.1" y="597.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="27px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="start">180</text><text x="92.0" y="687.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="25px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="start">New Docker · eager</text><rect x="490.0" y="653.0" width="757.5" height="49.0" rx="8.0" fill="url(#greenBar)" opacity="1.00"/><text x="1265.5" y="687.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="27px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="start">2,164</text><text x="92.0" y="777.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="25px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="start">New native · eager</text><rect x="490.0" y="743.0" width="737.6" height="49.0" rx="8.0" fill="url(#greenBar)" opacity="1.00"/><text x="1245.6" y="777.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="27px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="start">2,107</text><line x1="92.0" y1="923.0" x2="1508.0" y2="923.0" stroke="#26322c" stroke-width="1.0" opacity="1.00"/><text x="92.0" y="955.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="17px" font-weight="600" letter-spacing="0px" fill="#f4f7f4" text-anchor="start">3 starts × 3 snapshots · same Linux RSS/PSS collection method · Supervisor included</text><text x="92.0" y="981.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="16px" font-weight="400" letter-spacing="0px" fill="#9ca9a2" text-anchor="start">Default runs fewer services. PSS is process memory, not whole-machine RAM; engine/VM excluded.</text><text x="1508.0" y="981.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="13px" font-weight="600" letter-spacing="0px" fill="#53615a" text-anchor="end">supabase.com</text></svg>