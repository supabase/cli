<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Cold Supabase startup observations</title><desc id="desc">Cold startup seconds including transfer, extraction, and initialization.</desc><defs><linearGradient id="greenBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b1f8d2"/><stop offset="0.48" stop-color="#3ecf8e"/><stop offset="1" stop-color="#269b6b"/></linearGradient><linearGradient id="baseBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#65716a"/><stop offset="1" stop-color="#303833"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="16" result="blur"/></filter></defs><rect x="0.0" y="0.0" width="1600.0" height="1000.0" rx="0.0" fill="#0b0d0c" opacity="1.00"/><circle cx="1430" cy="170" r="300" fill="#113e2c" opacity="0.16" filter="url(#glow)"/><text x="92.0" y="78.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="17px" font-weight="700" letter-spacing="2.3px" fill="#3ecf8e" text-anchor="start">UBUNTU 22.04 · COLD STARTUP</text><text x="92.0" y="180.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="92px" font-weight="900" letter-spacing="0px" fill="#f4f7f4" text-anchor="start">cold starts from 5.2s</text><text x="94.0" y="232.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="22px" font-weight="500" letter-spacing="0px" fill="#9ca9a2" text-anchor="start">local mirror downloads + extraction + fresh database initialization</text><line x1="92.0" y1="280.0" x2="1508.0" y2="280.0" stroke="#26322c" stroke-width="1.0" opacity="1.00"/><rect x="248.0" y="699.9" width="84.0" height="90.1" rx="10.0" fill="url(#greenBar)" opacity="1.00"/><text x="290.0" y="679.9" font-family="Arial,Arial Unicode MS,sans-serif" font-size="32px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="middle">5.2s</text><text x="290.0" y="846.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="20px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="middle">Docker · default</text><text x="290.0" y="875.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="16px" font-weight="500" letter-spacing="0px" fill="#9ca9a2" text-anchor="middle">database ready</text><rect x="588.0" y="678.6" width="84.0" height="111.4" rx="10.0" fill="url(#greenBar)" opacity="1.00"/><text x="630.0" y="658.6" font-family="Arial,Arial Unicode MS,sans-serif" font-size="32px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="middle">6.4s</text><text x="630.0" y="846.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="20px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="middle">native · default</text><text x="630.0" y="875.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="16px" font-weight="500" letter-spacing="0px" fill="#9ca9a2" text-anchor="middle">database ready</text><rect x="928.0" y="400.0" width="84.0" height="390.0" rx="10.0" fill="url(#greenBar)" opacity="1.00"/><text x="970.0" y="380.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="32px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="middle">22.4s</text><text x="970.0" y="846.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="20px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="middle">Docker · eager</text><text x="970.0" y="875.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="16px" font-weight="500" letter-spacing="0px" fill="#9ca9a2" text-anchor="middle">all services ready</text><rect x="1268.0" y="498.9" width="84.0" height="291.1" rx="10.0" fill="url(#greenBar)" opacity="1.00"/><text x="1310.0" y="478.9" font-family="Arial,Arial Unicode MS,sans-serif" font-size="32px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="middle">16.7s</text><text x="1310.0" y="846.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="20px" font-weight="700" letter-spacing="0px" fill="#f4f7f4" text-anchor="middle">native · eager</text><text x="1310.0" y="875.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="16px" font-weight="500" letter-spacing="0px" fill="#9ca9a2" text-anchor="middle">all services ready</text><line x1="92.0" y1="930.0" x2="1508.0" y2="930.0" stroke="#26322c" stroke-width="1.0" opacity="1.00"/><text x="92.0" y="961.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="16px" font-weight="600" letter-spacing="0.15px" fill="#f4f7f4" text-anchor="start">Lower = less waiting · local mirror · one sample per configuration</text><text x="92.0" y="980.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="16px" font-weight="400" letter-spacing="0.15px" fill="#9ca9a2" text-anchor="start">Legacy public-download times are in the notes; different sources prevent a speedup comparison.</text><text x="1508.0" y="980.0" font-family="Arial,Arial Unicode MS,sans-serif" font-size="13px" font-weight="600" letter-spacing="0.5px" fill="#53615a" text-anchor="end">supabase.com</text></svg>